          // controller_ios32.c - reads the state written by the UIKit host
          // (on-screen pad + MFi gamepad) into the N64 pad.
          #ifdef CAPI_IOS32

          #include <stdint.h>
          #include <ultra64.h>

          #include "controller_api.h"
          #include "controller_ios32.h"
          #include "../ios32/ios32_host.h"

          static void ios32_init(void) {}

          static void ios32_read(OSContPad *pad) {
              pad->button |= ios32_input.touch_buttons | ios32_input.pad_buttons;

              if (ios32_input.start_pulse > 0) {
                  pad->button |= START_BUTTON;
                  ios32_input.start_pulse--;
              }

              // Touch stick wins while it is being used, otherwise the gamepad.
              int sx = ios32_input.touch_stick_x, sy = ios32_input.touch_stick_y;
              if (sx == 0 && sy == 0) {
                  sx = ios32_input.pad_stick_x;
                  sy = ios32_input.pad_stick_y;
              }
              pad->stick_x = (s8)sx;
              pad->stick_y = (s8)sy;
          }

          static u32 ios32_rawkey(void) { return VK_INVALID; }

          static void ios32_rumble_play(float str, float time) { (void)str; (void)time; }
          static void ios32_rumble_stop(void) {}

          struct ControllerAPI controller_ios32 = {
              0,
              ios32_init,
              ios32_read,
              ios32_rawkey,
              ios32_rumble_play,
              ios32_rumble_stop,
              NULL,
              NULL
          };

