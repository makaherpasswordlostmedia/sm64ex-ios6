              [_gear setTitle:@"\u2699" forState:UIControlStateNormal];
              [_gear setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [_gear addTarget:self action:@selector(openSettings) forControlEvents:UIControlEventTouchUpInside];
              [root addSubview:_gear];
