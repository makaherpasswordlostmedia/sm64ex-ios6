          }
          - (void)padRefresh { [_pad setNeedsLayout]; [_pad setNeedsDisplay]; }
          - (void)openCheats {
              if (_cheats) return;
              CGRect b = self.view.bounds;
              CGFloat w = MIN(400, b.size.width - 40), h = MIN(b.size.height - 20, 372);
              _cheats = [[Ios32CheatsPanel alloc] initWithFrame:CGRectMake((b.size.width - w) / 2, (b.size.height - h) / 2, w, h)];
              __weak Ios32RootVC *me = self;
              _cheats.onClose = ^{ [me closeCheats]; };
              [self.view addSubview:_cheats];
          }
          - (void)closeCheats { [_cheats removeFromSuperview]; _cheats = nil; }
          - (void)closeSettings { [_panel removeFromSuperview]; _panel = nil; }
          - (void)openSettings {
              if (_panel) return;
              CGRect b = self.view.bounds;
              CGFloat w = MIN(460, b.size.width - 40), h = MIN(b.size.height - 20, 372);
              _panel = [[Ios32SettingsPanel alloc] initWithFrame:CGRectMake((b.size.width - w) / 2, (b.size.height - h) / 2, w, h)];
              __weak Ios32RootVC *me = self;
              _panel.onChange = ^{ [me padRefresh]; };
              _panel.onClose  = ^{ [me closeSettings]; };
              _panel.onCheats = ^{ [me openCheats]; };
              [self.view addSubview:_panel];
          }
