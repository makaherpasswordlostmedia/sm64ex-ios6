          // ios32_settings.h - persistent touch-control settings (port of Crash
          // Bandicoot's TouchControlSettings to plain C, iOS 7 safe, no NSUserDefaults).
          #ifndef IOS32_SETTINGS_H
          #define IOS32_SETTINGS_H

          #include <stdbool.h>

          struct Ios32Settings {
              bool  show_pad;      // draw + accept on-screen controls
              float opacity;       // 0.20 .. 1.00
              float scale;         // 0.70 .. 1.40  (buttons)
              float stick_scale;   // 0.70 .. 1.60
              bool  float_stick;   // true = stick appears under the finger
              bool  mirror;        // swap left/right halves (left-handed layout)
              bool  show_c;        // draw the C-button cluster
          };
          extern struct Ios32Settings ios32_cfg;

          void ios32_settings_load(void);   // call once after paths are known
          void ios32_settings_save(void);
          void ios32_settings_reset(void);

          #endif
          EOF_SM64
          cat > src/pc/ios32/ios32_settings.m <<'EOF_SM64'
          // ios32_settings.m - key=value file at <Documents>/touch_settings.cfg
          #import <Foundation/Foundation.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "ios32_settings.h"
          #include "ios32_host.h"
          #include "../cheats.h"

          struct Ios32Settings ios32_cfg;

          static float clampf(float v, float lo, float hi) { return v < lo ? lo : (v > hi ? hi : v); }

          void ios32_settings_reset(void) {
              ios32_cfg.show_pad    = true;
              ios32_cfg.opacity     = 1.0f;
              ios32_cfg.scale       = 1.0f;
              ios32_cfg.stick_scale = 1.0f;
              ios32_cfg.float_stick = true;
              ios32_cfg.mirror      = false;
              ios32_cfg.show_c      = true;
          }

          // name -> flag, kept in sync with struct CheatList
          static const struct { const char *key; bool *flag; } kCheats[] = {
              {"cheats_on", &Cheats.EnableCheats}, {"moon_jump", &Cheats.MoonJump},
              {"god_mode", &Cheats.GodMode},       {"inf_lives", &Cheats.InfiniteLives},
              {"super_speed", &Cheats.SuperSpeed}, {"responsive", &Cheats.Responsive},
              {"exit_anywhere", &Cheats.ExitAnywhere}, {"huge_mario", &Cheats.HugeMario},
              {"tiny_mario", &Cheats.TinyMario},
          };
          #define NCHEATS (sizeof kCheats / sizeof kCheats[0])

          static void path(char *out, size_t n) {
              snprintf(out, n, "%s/touch_settings.cfg", ios32_user_dir());
          }

          void ios32_settings_save(void) {
              char p[640]; path(p, sizeof p);
              FILE *f = fopen(p, "w");
              if (!f) return;
              fprintf(f, "show_pad=%d\nopacity=%.3f\nscale=%.3f\nstick_scale=%.3f\n"
                         "float_stick=%d\nmirror=%d\nshow_c=%d\n",
                      ios32_cfg.show_pad, ios32_cfg.opacity, ios32_cfg.scale, ios32_cfg.stick_scale,
                      ios32_cfg.float_stick, ios32_cfg.mirror, ios32_cfg.show_c);
              for (size_t i = 0; i < NCHEATS; i++) fprintf(f, "%s=%d\n", kCheats[i].key, *kCheats[i].flag);
              fclose(f);
          }

          void ios32_settings_load(void) {
              ios32_settings_reset();
              char p[640]; path(p, sizeof p);
              FILE *f = fopen(p, "r");
              if (!f) return;
              char line[128];
              while (fgets(line, sizeof line, f)) {
                  char *eq = strchr(line, '=');
                  if (!eq) continue;
                  *eq = 0;
                  float v = (float)atof(eq + 1);
                  if      (!strcmp(line, "show_pad"))    ios32_cfg.show_pad = v != 0;
                  else if (!strcmp(line, "opacity"))     ios32_cfg.opacity = clampf(v, 0.20f, 1.0f);
                  else if (!strcmp(line, "scale"))       ios32_cfg.scale = clampf(v, 0.70f, 1.40f);
                  else if (!strcmp(line, "stick_scale")) ios32_cfg.stick_scale = clampf(v, 0.70f, 1.60f);
                  else if (!strcmp(line, "float_stick")) ios32_cfg.float_stick = v != 0;
                  else if (!strcmp(line, "mirror"))      ios32_cfg.mirror = v != 0;
                  else if (!strcmp(line, "show_c"))      ios32_cfg.show_c = v != 0;
                  else for (size_t i = 0; i < NCHEATS; i++)
                      if (!strcmp(line, kCheats[i].key)) *kCheats[i].flag = v != 0;
              }
              fclose(f);
          }
