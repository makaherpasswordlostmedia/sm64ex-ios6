          cat > src/pc/ios32/ios32_host.m <<'EOF_SM64'
          // ios32_host.m - UIKit host for the 32-bit iOS 7+ build: window, GL view,
          // on-screen N64 pad, MFi controllers, lifecycle. Plain MRC-free ObjC (ARC on).
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <GameController/GameController.h>
          #include <stdarg.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <math.h>
          #include <sys/stat.h>

          #include "ios32_host.h"
          #include "ios32_settings.h"
          #include "../cheats.h"

          // N64 button bits (same values as include/PR/os_cont.h)
          #define N64_A       0x8000
          #define N64_B       0x4000
          #define N64_Z       0x2000
          #define N64_START   0x1000
          #define N64_L       0x0020
          #define N64_R       0x0010
          #define N64_CUP     0x0008
          #define N64_CDOWN   0x0004
          #define N64_CLEFT   0x0002
          #define N64_CRIGHT  0x0001

          volatile int ios32_paused = 0;
          volatile int ios32_game_idle = 0;
          struct Ios32Input ios32_input;

          static char g_docs[512], g_bundle[512], g_logpath[600];
          static pthread_mutex_t g_log_mx = PTHREAD_MUTEX_INITIALIZER;
          static UIView *g_glview;

          const char *ios32_user_dir(void) { return g_docs; }
          const char *ios32_bundle_dir(void) { return g_bundle; }
          UIView *ios32_gl_view(void) { return g_glview; }

          void ios32_log(const char *fmt, ...) {
              pthread_mutex_lock(&g_log_mx);
              FILE *f = g_logpath[0] ? fopen(g_logpath, "a") : NULL;
              if (f) {
                  va_list a; va_start(a, fmt);
                  vfprintf(f, fmt, a); fputc('\n', f);
                  va_end(a); fclose(f);
              }
              pthread_mutex_unlock(&g_log_mx);
          }

          // ---------------------------------------------------------------------------
          // GL view
          // ---------------------------------------------------------------------------
          @interface Ios32GLView : UIView
          @end
          @implementation Ios32GLView
          + (Class)layerClass { return [CAEAGLLayer class]; }
          @end

          // ---------------------------------------------------------------------------
          // On-screen N64 pad
          // ---------------------------------------------------------------------------
          typedef struct { uint16_t mask; CGPoint c; CGFloat r; const char *label; } PadBtn;

          @interface Ios32PadView : UIView
          @end

          @implementation Ios32PadView {
              PadBtn _btn[9];
              int _n;
              CGFloat _u;
              CGPoint _stickOrigin, _stickPos;
              CGFloat _stickR;
              __weak UITouch *_stickTouch;
              BOOL _stickActive;
              uint16_t _down;
          }

          - (instancetype)initWithFrame:(CGRect)f {
              if ((self = [super initWithFrame:f])) {
                  self.multipleTouchEnabled = YES;
                  self.backgroundColor = [UIColor clearColor];
                  self.opaque = NO;
                  self.userInteractionEnabled = YES;
                  self.contentMode = UIViewContentModeRedraw;
              }
              return self;
          }

          - (void)layoutSubviews {
              CGFloat W = self.bounds.size.width, H = self.bounds.size.height;
              CGFloat u = MIN(MIN(W, H) / 320.0, 1.6) * ios32_cfg.scale;
              _u = u;
              _stickR = 58 * u * ios32_cfg.stick_scale / ios32_cfg.scale;
              _n = 0;
              // x positions are measured from the right edge; mirror flips them
              #define RX(d) (ios32_cfg.mirror ? (d) : W - (d))
              _btn[_n++] = (PadBtn){ N64_A,      CGPointMake(RX(62 * u),  H - 62 * u),  34 * u, "A" };
              _btn[_n++] = (PadBtn){ N64_B,      CGPointMake(RX(130 * u), H - 46 * u),  28 * u, "B" };
              _btn[_n++] = (PadBtn){ N64_Z,      CGPointMake(RX(46 * u),  H - 138 * u), 26 * u, "Z" };
              _btn[_n++] = (PadBtn){ N64_R,      CGPointMake(RX(36 * u),  26 * u),      22 * u, "R" };
              _btn[_n++] = (PadBtn){ N64_L,      CGPointMake(ios32_cfg.mirror ? W - 90 * u : 90 * u, 26 * u), 22 * u, "L" };
              _btn[_n++] = (PadBtn){ N64_START,  CGPointMake(W / 2,       H - 24 * u),  20 * u, "S" };
              [self setNeedsDisplay];
          }

          - (CGPoint)fixedStickOrigin {
              CGFloat W = self.bounds.size.width;
              CGFloat x = 100 * _u;
              return CGPointMake(ios32_cfg.mirror ? W - x : x, self.bounds.size.height - 90 * _u);
          }

          // C-button cluster geometry (computed on demand)
          - (void)cButtons:(PadBtn *)out {
              CGFloat W = self.bounds.size.width;
              CGFloat u = _u;
              CGPoint cc = CGPointMake(ios32_cfg.mirror ? 104 * u : W - 104 * u, 104 * u);
              CGFloat cs = 36 * u, r = 19 * u;
              out[0] = (PadBtn){ N64_CUP,    CGPointMake(cc.x,      cc.y - cs), r, "^" };
              out[1] = (PadBtn){ N64_CDOWN,  CGPointMake(cc.x,      cc.y + cs), r, "v" };
              out[2] = (PadBtn){ N64_CLEFT,  CGPointMake(cc.x - cs, cc.y),      r, "<" };
              out[3] = (PadBtn){ N64_CRIGHT, CGPointMake(cc.x + cs, cc.y),      r, ">" };
          }

          - (void)drawRect:(CGRect)rect {
              if (!ios32_cfg.show_pad) return;
              CGContextRef g = UIGraphicsGetCurrentContext();
              CGContextSetLineWidth(g, 2);
              CGContextSetAlpha(g, ios32_cfg.opacity);
              PadBtn c[4];
              [self cButtons:c];
              PadBtn all[13];
              int n = 0;
              for (int i = 0; i < _n; i++) all[n++] = _btn[i];
              if (ios32_cfg.show_c) for (int i = 0; i < 4; i++) all[n++] = c[i];
              for (int i = 0; i < n; i++) {
                  PadBtn *b = &all[i];
                  BOOL on = (_down & b->mask) != 0;
                  CGContextSetRGBStrokeColor(g, 1, 1, 1, on ? 0.9 : 0.4);
                  CGContextSetRGBFillColor(g, 1, 1, 1, on ? 0.35 : 0.10);
                  CGContextAddEllipseInRect(g, CGRectMake(b->c.x - b->r, b->c.y - b->r, b->r * 2, b->r * 2));
                  CGContextDrawPath(g, kCGPathFillStroke);
                  NSString *s = [NSString stringWithUTF8String:b->label];
                  UIFont *font = [UIFont boldSystemFontOfSize:MAX(11, b->r * 0.7)];
                  [[UIColor colorWithWhite:1 alpha:0.7] set];
                  CGSize sz = [s sizeWithFont:font];   // iOS 7-compatible (deprecated later)
                  [s drawAtPoint:CGPointMake(b->c.x - sz.width / 2, b->c.y - sz.height / 2) withFont:font];
              }
              // analog stick
              CGPoint o = _stickActive ? _stickOrigin : [self fixedStickOrigin];
              CGContextSetRGBStrokeColor(g, 1, 1, 1, _stickActive ? 0.6 : 0.3);
              CGContextSetRGBFillColor(g, 1, 1, 1, 0.06);
              CGContextAddEllipseInRect(g, CGRectMake(o.x - _stickR, o.y - _stickR, _stickR * 2, _stickR * 2));
              CGContextDrawPath(g, kCGPathFillStroke);
              CGPoint k = _stickActive ? _stickPos : o;
              CGFloat kr = 24 * _u;
              CGContextSetRGBFillColor(g, 1, 1, 1, _stickActive ? 0.4 : 0.18);
              CGContextAddEllipseInRect(g, CGRectMake(k.x - kr, k.y - kr, kr * 2, kr * 2));
              CGContextFillPath(g);
          }

          - (BOOL)touchIsOnButton:(CGPoint)p {
              PadBtn c[4];
              [self cButtons:c];
              for (int i = 0; i < _n; i++)
                  if (hypot(p.x - _btn[i].c.x, p.y - _btn[i].c.y) <= _btn[i].r * 1.25) return YES;
              if (ios32_cfg.show_c) for (int i = 0; i < 4; i++)
                  if (hypot(p.x - c[i].c.x, p.y - c[i].c.y) <= c[i].r * 1.25) return YES;
              return NO;
          }

          - (void)recompute:(NSSet *)all {
              if (!ios32_cfg.show_pad) { ios32_input.touch_buttons = 0; ios32_input.touch_stick_x = 0; ios32_input.touch_stick_y = 0; _down = 0; _stickTouch = nil; _stickActive = NO; return; }
              uint16_t m = 0;
              PadBtn c[4];
              [self cButtons:c];
              BOOL stickSeen = NO;
              for (UITouch *t in all) {
                  if (t.phase == UITouchPhaseEnded || t.phase == UITouchPhaseCancelled) continue;
                  CGPoint p = [t locationInView:self];
                  if (t == _stickTouch) {
                      stickSeen = YES;
                      CGFloat dx = p.x - _stickOrigin.x, dy = p.y - _stickOrigin.y;
                      CGFloat d = hypot(dx, dy);
                      if (d > _stickR) { dx *= _stickR / d; dy *= _stickR / d; d = _stickR; }
                      _stickPos = CGPointMake(_stickOrigin.x + dx, _stickOrigin.y + dy);
                      CGFloat nx = dx / _stickR, ny = dy / _stickR;
                      if (d < _stickR * 0.12) { nx = 0; ny = 0; }
                      ios32_input.touch_stick_x = (int8_t)lrintf(nx * 80.0f);
                      ios32_input.touch_stick_y = (int8_t)lrintf(-ny * 80.0f);
                      continue;
                  }
                  for (int i = 0; i < _n; i++)
                      if (hypot(p.x - _btn[i].c.x, p.y - _btn[i].c.y) <= _btn[i].r * 1.25) m |= _btn[i].mask;
                  if (ios32_cfg.show_c) for (int i = 0; i < 4; i++)
                      if (hypot(p.x - c[i].c.x, p.y - c[i].c.y) <= c[i].r * 1.25) m |= c[i].mask;
              }
              if (!stickSeen) {
                  _stickTouch = nil; _stickActive = NO;
                  ios32_input.touch_stick_x = 0; ios32_input.touch_stick_y = 0;
              }
              _down = m;
              ios32_input.touch_buttons = m;
              [self setNeedsDisplay];
          }

          - (void)touchesBegan:(NSSet *)touches withEvent:(UIEvent *)e {
              CGFloat W = self.bounds.size.width;
              if (!ios32_cfg.show_pad) return;
              for (UITouch *t in touches) {
                  CGPoint p = [t locationInView:self];
                  BOOL inZone = ios32_cfg.mirror ? p.x > W * 0.55 : p.x < W * 0.45;
                  if (!_stickTouch && inZone && ![self touchIsOnButton:p]) {
                      _stickTouch = t; _stickActive = YES;
                      _stickOrigin = ios32_cfg.float_stick ? p : [self fixedStickOrigin];
                      _stickPos = p;
                  }
              }
              [self recompute:[e allTouches]];
          }
          - (void)touchesMoved:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          - (void)touchesEnded:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          - (void)touchesCancelled:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          @end


          // ---------------------------------------------------------------------------
          // Settings panel (opened with the gear button). Saved to touch_settings.cfg.
          // ---------------------------------------------------------------------------
          @interface Ios32SettingsPanel : UIView
          @property (copy) void (^onChange)(void);
          @property (copy) void (^onClose)(void);
          @property (copy) void (^onCheats)(void);
          @end

          @implementation Ios32SettingsPanel {
              UISlider *_op, *_sc, *_st;
              UISwitch *_show, *_float, *_mirror, *_showc;
          }

          - (UILabel *)label:(NSString *)t y:(CGFloat)y {
              UILabel *l = [[UILabel alloc] initWithFrame:CGRectMake(16, y, 180, 28)];
              l.text = t; l.textColor = [UIColor whiteColor]; l.backgroundColor = [UIColor clearColor];
              l.font = [UIFont systemFontOfSize:15];
              [self addSubview:l];
              return l;
          }
          - (UISlider *)slider:(float)lo hi:(float)hi val:(float)v y:(CGFloat)y {
              UISlider *s = [[UISlider alloc] initWithFrame:CGRectMake(190, y, self.bounds.size.width - 206, 28)];
              s.minimumValue = lo; s.maximumValue = hi; s.value = v;
              [s addTarget:self action:@selector(changed) forControlEvents:UIControlEventValueChanged];
              [self addSubview:s];
              return s;
          }
          - (UISwitch *)toggle:(BOOL)on y:(CGFloat)y {
              UISwitch *w = [[UISwitch alloc] init];
              CGRect f = w.frame; f.origin = CGPointMake(self.bounds.size.width - f.size.width - 16, y);
              w.frame = f; w.on = on;
              [w addTarget:self action:@selector(changed) forControlEvents:UIControlEventValueChanged];
              [self addSubview:w];
              return w;
          }

          - (instancetype)initWithFrame:(CGRect)f {
              if ((self = [super initWithFrame:f])) {
                  self.backgroundColor = [UIColor colorWithWhite:0.05 alpha:0.92];
                  self.layer.cornerRadius = 12;
                  CGFloat y = 10, row = 34;
                  UILabel *title = [self label:@"Touch controls" y:y];
                  title.font = [UIFont boldSystemFontOfSize:17];
                  y += row;
                  [self label:@"Show controls" y:y];     _show   = [self toggle:ios32_cfg.show_pad y:y];     y += row;
                  [self label:@"Opacity" y:y];           _op = [self slider:0.20f hi:1.0f val:ios32_cfg.opacity y:y];          y += row;
                  [self label:@"Button size" y:y];       _sc = [self slider:0.70f hi:1.40f val:ios32_cfg.scale y:y];           y += row;
                  [self label:@"Stick size" y:y];        _st = [self slider:0.70f hi:1.60f val:ios32_cfg.stick_scale y:y];     y += row;
                  [self label:@"Floating stick" y:y];    _float  = [self toggle:ios32_cfg.float_stick y:y];  y += row;
                  [self label:@"Left-handed layout" y:y];_mirror = [self toggle:ios32_cfg.mirror y:y];      y += row;
                  [self label:@"C buttons" y:y];         _showc  = [self toggle:ios32_cfg.show_c y:y];       y += row + 4;

                  UIButton *reset = [UIButton buttonWithType:UIButtonTypeRoundedRect];
                  reset.frame = CGRectMake(16, y, 110, 32);
                  [reset setTitle:@"Reset" forState:UIControlStateNormal];
                  [reset addTarget:self action:@selector(doReset) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:reset];
                  UIButton *ch = [UIButton buttonWithType:UIButtonTypeRoundedRect];
                  ch.frame = CGRectMake(f.size.width / 2 - 55, y, 110, 32);
                  [ch setTitle:@"Cheats" forState:UIControlStateNormal];
                  [ch addTarget:self action:@selector(doCheats) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:ch];
                  UIButton *close = [UIButton buttonWithType:UIButtonTypeRoundedRect];
                  close.frame = CGRectMake(f.size.width - 126, y, 110, 32);
                  [close setTitle:@"Done" forState:UIControlStateNormal];
                  [close addTarget:self action:@selector(doClose) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:close];
              }
              return self;
          }

          - (void)changed {
              ios32_cfg.show_pad    = _show.on;
              ios32_cfg.opacity     = _op.value;
              ios32_cfg.scale       = _sc.value;
              ios32_cfg.stick_scale = _st.value;
              ios32_cfg.float_stick = _float.on;
              ios32_cfg.mirror      = _mirror.on;
              ios32_cfg.show_c      = _showc.on;
              if (self.onChange) self.onChange();
          }
          - (void)doReset {
              ios32_settings_reset();
              _show.on = ios32_cfg.show_pad;  _op.value = ios32_cfg.opacity;
              _sc.value = ios32_cfg.scale;    _st.value = ios32_cfg.stick_scale;
              _float.on = ios32_cfg.float_stick; _mirror.on = ios32_cfg.mirror; _showc.on = ios32_cfg.show_c;
              if (self.onChange) self.onChange();
          }
          - (void)doCheats { if (self.onCheats) self.onCheats(); }
          - (void)doClose {
              ios32_settings_save();
