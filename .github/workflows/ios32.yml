              if (b.size.width < b.size.height) b = CGRectMake(0, 0, b.size.height, b.size.width);
              UIView *root = [[UIView alloc] initWithFrame:b];
              root.backgroundColor = [UIColor blackColor];
              g_glview = [[Ios32GLView alloc] initWithFrame:b];
              g_glview.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_glview.multipleTouchEnabled = NO;
              g_glview.userInteractionEnabled = NO;
              [root addSubview:g_glview];
              _pad = [[Ios32PadView alloc] initWithFrame:b];
              _pad.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [root addSubview:_pad];

              _gear = [UIButton buttonWithType:UIButtonTypeCustom];
              _gear.frame = CGRectMake(6, 6, 40, 40);
              _gear.alpha = 0.45;
