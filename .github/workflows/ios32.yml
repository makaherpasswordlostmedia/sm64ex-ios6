          @interface Ios32AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          extern void ios32_audio_pause(int pause);   // audio_ios32.m

          @implementation Ios32AppDelegate

          - (void)gameMain:(id)arg {
              @autoreleasepool { ios32_game_main(); }
          }

          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
              snprintf(g_docs, sizeof g_docs, "%s", docs.UTF8String);
              snprintf(g_bundle, sizeof g_bundle, "%s", [[NSBundle mainBundle] bundlePath].UTF8String);
              snprintf(g_logpath, sizeof g_logpath, "%s/sm64.log", g_docs);
              mkdir(g_docs, 0755);
              ios32_settings_load();
              ios32_log("---- launch, iOS %s", [[UIDevice currentDevice] systemVersion].UTF8String);

              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [Ios32RootVC new];
              [self.window makeKeyAndVisible];
              app.idleTimerDisabled = YES;

              [[NSNotificationCenter defaultCenter] addObserverForName:GCControllerDidConnectNotification
                                                                object:nil queue:nil
                                                            usingBlock:^(NSNotification *n) { gc_attach(n.object); }];
              [[NSNotificationCenter defaultCenter] addObserverForName:GCControllerDidDisconnectNotification
                                                                object:nil queue:nil
                                                            usingBlock:^(NSNotification *n) {
                  ios32_input.pad_connected = 0; ios32_input.pad_buttons = 0;
                  ios32_input.pad_stick_x = 0;   ios32_input.pad_stick_y = 0;
              }];
              for (GCController *c in [GCController controllers]) gc_attach(c);

              NSThread *t = [[NSThread alloc] initWithTarget:self selector:@selector(gameMain:) object:nil];
              t.stackSize = 8 * 1024 * 1024;
              t.name = @"sm64-game";
              [t start];
              return YES;
          }

          // GL work from the background is a hard crash on iOS: stop the game thread
          // first and wait (bounded) until it confirms it is between frames.
          - (void)applicationWillResignActive:(UIApplication *)a {
              ios32_paused = 1;
              ios32_audio_pause(1);
              for (int i = 0; i < 100 && !ios32_game_idle; i++) usleep(5000);
          }
          - (void)applicationDidBecomeActive:(UIApplication *)a {
              ios32_audio_pause(0);
              ios32_paused = 0;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([Ios32AppDelegate class]));
              }
          }
