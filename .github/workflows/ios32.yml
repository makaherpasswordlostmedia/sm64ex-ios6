      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip python3-venv \
            zip unzip xz-utils bzip2 bsdmainutils git curl file

      # --- toolchain + SDK are the slow, static part: cache them -------------
      - name: Cache Theos toolchain + SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-ios9.3-L1ghtmann-update3-v1

      - name: Install Theos + iOS toolchain + iPhoneOS 9.3 SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "$TOOLCHAIN_URL" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL "$SDK_URL" -o /tmp/sdk.tbz2
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          # modern clang wants Modules/module.modulemap, the 9.3 SDK ships module.map
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done

      - name: Check toolchain
        run: |
          set -euo pipefail
          ls "$THEOS/toolchain/linux/iphone/bin" | head -30
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          test -d "$THEOS/sdks/iPhoneOS9.3.sdk"

      # --- ROM -----------------------------------------------------------------
      - name: Fetch ROM (yours, from Google Drive)
        env:
          ROM_ID: ${{ inputs.rom_file_id || secrets.DRIVE_ROM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${ROM_ID:-}" ]; then
            echo "::error::ROM id missing. Fill rom_file_id or set the repo secret DRIVE_ROM_ID."
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          "$RUNNER_TEMP/venv/bin/gdown" "$ROM_ID" -O "baserom.$VERSION.z64"
          ls -la "baserom.$VERSION.z64"
          [ "$(stat -c %s "baserom.$VERSION.z64")" -ge 8000000 ] || {
            echo "::error::ROM is too small - Drive sharing must be 'Anyone with the link' (got an HTML page?)"
            head -c 300 "baserom.$VERSION.z64"; exit 1; }

      - name: Verify ROM SHA1
        if: inputs.verify_sha1
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          have="$(sha1sum "baserom.$VERSION.z64" | cut -d' ' -f1)"
          want="$(cut -d' ' -f1 "sm64.$VERSION.sha1")"
          echo "have $have"; echo "want $want"
          if [ "$have" != "$want" ]; then
            echo "::error::ROM SHA1 mismatch for region $VERSION (byte-swapped .v64/.n64? use big-endian .z64)"
            exit 1
          fi

      # --- build ---------------------------------------------------------------
      - name: Patch extract_assets.py for Linux (no Homebrew)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          p = "extract_assets.py"
          s = open(p).read()
          s = re.sub(r'    osx_gcc_ver = subprocess\.run\(.*\n', '    osx_gcc_ver = ""\n', s)
          s = s.replace('"CC=gcc-" + osx_gcc_ver, "CXX=g++-" + osx_gcc_ver', '"CC=gcc", "CXX=g++"')
          open(p, "w").write(s)
          PY
          grep -n 'gmake\|osx_gcc_ver' extract_assets.py

      - name: Build host tools first (clean PATH, host gcc)
        run: |
          set -euo pipefail
          make -C tools -j"$(nproc)" CC=gcc CXX=g++ n64graphics skyconv mio0 aifc_decode

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod +x build_ios32.sh
          ./build_ios32.sh 2>&1 | tee build-ios32.log

      - name: Verify Mach-O
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APP="build/${VERSION}_pc/sm64ios32.app"
          BIN="$APP/sm64ios32"
          [ -f "$BIN" ] || { echo "::error::binary not found: $BIN"; exit 1; }
          file "$BIN"
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          OTOOL="$(ls "$TOOLBIN"/*otool* 2>/dev/null | head -n1 || true)"
          if [ -n "$OTOOL" ]; then
            "$OTOOL" -hv -l "$BIN" | grep -E "cputype|ARM|LC_VERSION_MIN|version|minos" | head -10 || true
          fi
          file "$BIN" | grep -qi "arm" || { echo "::error::not an ARM Mach-O"; exit 1; }
          # must be an armv7 build for iOS 7.0, not an arm64/SDL leftover
          if strings "$BIN" | grep -q "SDL_Init"; then echo "::error::SDL leaked into the ios32 build"; exit 1; fi
          plutil_min="$(grep -A1 MinimumOSVersion "$APP/Info.plist" | tail -n1 || true)"
          echo "Info.plist: $plutil_min"
          ls -la "$APP" | head -20

      - name: Name .ipa
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SRC="build/${VERSION}_pc/sm64ios32.ipa"
          [ -f "$SRC" ] || { echo "::error::$SRC not produced"; exit 1; }
          cp "$SRC" "SM64-armv7-${VERSION}-$(git rev-parse --short HEAD).ipa"
          unzip -l SM64-armv7-*.ipa | grep -q "Payload/sm64ios32.app/sm64ios32" || { echo "::error::ipa layout wrong"; exit 1; }
          ls -la SM64-armv7-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SM64-armv7-iOS7-${{ inputs.version }}
          path: SM64-armv7-*.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-ios32-${{ inputs.version }}
          path: build-ios32.log
          if-no-files-found: ignore

      # the ROM must never be left on the runner / in artifacts
      - name: Remove ROM
        if: always()
        run: rm -f baserom.*.z64
