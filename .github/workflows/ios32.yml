          cat > src/pc/gfx/gfx_ios32.m <<'EOF_SM64'
          // gfx_ios32.m - window manager backend for 32-bit iOS 7+ (EAGL / OpenGL ES 2.0).
          // Replaces gfx_sdl2.m + gfx_uikit.m. The game runs on its own thread; this file
          // owns the EAGLContext and presents the renderbuffer.
          #ifdef WAPI_IOS32

          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <OpenGLES/EAGL.h>
          #import <OpenGLES/ES2/gl.h>
          #import <OpenGLES/ES2/glext.h>
          #include <mach/mach_time.h>
          #include <unistd.h>
          #include <stdint.h>

          #include "gfx_window_manager_api.h"
          #include "gfx_screen_config.h"
          #include "gfx_ios32.h"
          #include "../configfile.h"
          #include "../ios32/ios32_host.h"

          #ifdef VERSION_EU
          # define FRAMERATE 25
          #else
          # define FRAMERATE 30
          #endif

          static EAGLContext *g_ctx;
          static GLuint g_fbo, g_color_rb, g_depth_rb;
          static GLint g_w, g_h;

          static uint64_t now_ns(void) {
              static mach_timebase_info_data_t tb;
              if (tb.denom == 0) mach_timebase_info(&tb);
              uint64_t t = mach_absolute_time();
              return (tb.numer == tb.denom) ? t : (t * tb.numer / tb.denom);
          }

          static void gfx_ios32_init(const char *window_title) {
              (void)window_title;
              // The view is created by the app delegate on the main thread; wait for it.
              for (int i = 0; i < 400 && !ios32_gl_view(); i++) usleep(10000);
              __block CAEAGLLayer *layer = nil;
              dispatch_sync(dispatch_get_main_queue(), ^{
                  UIView *v = ios32_gl_view();
                  // Big retina iPads cannot keep up at native res: render at 1x there.
                  CGSize sz = [UIScreen mainScreen].bounds.size;
                  CGFloat scale = [UIScreen mainScreen].scale;
                  CGFloat longest = MAX(sz.width, sz.height) * scale;
                  if (longest > 1200.0) scale = 1.0;
                  v.contentScaleFactor = scale;
                  layer = (CAEAGLLayer *)v.layer;
                  layer.opaque = YES;
                  layer.contentsScale = scale;
                  layer.drawableProperties = @{ kEAGLDrawablePropertyRetainedBacking: @NO,
                                                kEAGLDrawablePropertyColorFormat: kEAGLColorFormatRGBA8 };
              });

              g_ctx = [[EAGLContext alloc] initWithAPI:kEAGLRenderingAPIOpenGLES2];
              [EAGLContext setCurrentContext:g_ctx];

              glGenFramebuffers(1, &g_fbo);
              glGenRenderbuffers(1, &g_color_rb);
              glGenRenderbuffers(1, &g_depth_rb);
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              glBindRenderbuffer(GL_RENDERBUFFER, g_color_rb);
              [g_ctx renderbufferStorage:GL_RENDERBUFFER fromDrawable:layer];
              glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_RENDERBUFFER, g_color_rb);
              glGetRenderbufferParameteriv(GL_RENDERBUFFER, GL_RENDERBUFFER_WIDTH, &g_w);
              glGetRenderbufferParameteriv(GL_RENDERBUFFER, GL_RENDERBUFFER_HEIGHT, &g_h);
              glBindRenderbuffer(GL_RENDERBUFFER, g_depth_rb);
              glRenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH_COMPONENT16, g_w, g_h);
              glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT, GL_RENDERBUFFER, g_depth_rb);
              GLenum st = glCheckFramebufferStatus(GL_FRAMEBUFFER);
              ios32_log("[GL] %dx%d fbo status 0x%x, renderer %s", g_w, g_h, st, (const char *)glGetString(GL_RENDERER));

              configWindow.w = g_w;
              configWindow.h = g_h;
          }

          static void gfx_ios32_set_keyboard_callbacks(kb_callback_t kd, kb_callback_t ku, void (*all_up)(void)) {
              (void)kd; (void)ku; (void)all_up;   // no hardware keyboard support
          }

          static void gfx_ios32_set_touchscreen_callbacks(void (*d)(void *), void (*m)(void *), void (*u)(void *)) {
              (void)d; (void)m; (void)u;          // touches are handled by Ios32PadView
          }

          // Fixed 30 FPS pacing on the game thread. presentRenderbuffer is vsynced (60 Hz)
          // so on-time frames land every second refresh.
          static void gfx_ios32_main_loop(void (*run_one_game_iter)(void)) {
              const uint64_t frame_ns = 1000000000ull / FRAMERATE;
              uint64_t next = now_ns();
              for (;;) {
                  if (ios32_paused) {
                      ios32_game_idle = 1;
                      while (ios32_paused) usleep(20000);
                      ios32_game_idle = 0;
                      next = now_ns();
                  }
                  run_one_game_iter();
                  next += frame_ns;
                  uint64_t t = now_ns();
                  if (t < next) usleep((useconds_t)((next - t) / 1000));
                  else if (t - next > 4 * frame_ns) next = t;   // fell far behind: resync
              }
          }

          static void gfx_ios32_get_dimensions(uint32_t *width, uint32_t *height) {
              if (width) *width = (uint32_t)g_w;
              if (height) *height = (uint32_t)g_h;
          }

          static void gfx_ios32_handle_events(void) {}

          static bool gfx_ios32_start_frame(void) {
              if (ios32_paused) return false;
              [EAGLContext setCurrentContext:g_ctx];
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              return true;
          }

          static void gfx_ios32_swap_buffers_begin(void) {}

          static void gfx_ios32_swap_buffers_end(void) {
              if (ios32_paused) return;
              glBindRenderbuffer(GL_RENDERBUFFER, g_color_rb);
              [g_ctx presentRenderbuffer:GL_RENDERBUFFER];
              // Contents are undefined after present: let the driver skip the restore.
              const GLenum discard[] = { GL_DEPTH_ATTACHMENT };
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              glDiscardFramebufferEXT(GL_FRAMEBUFFER, 1, discard);
          }

          static double gfx_ios32_get_time(void) { return 0.0; }

          static void gfx_ios32_shutdown(void) {}

          static void gfx_ios32_reset_dimension_and_pos(void) {
              configWindow.w = g_w;
              configWindow.h = g_h;
              configWindow.reset = false;
              configWindow.settings_changed = false;
          }

