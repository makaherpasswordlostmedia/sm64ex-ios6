          // audio_ios32.m - AudioQueue output for iOS 7+. The game pushes 32 kHz stereo
          // s16 frames via play(); a lock-free SPSC ring feeds the AudioQueue callback.
          #ifdef AAPI_IOS32

          #import <AudioToolbox/AudioToolbox.h>
          #import <AVFoundation/AVFoundation.h>
          #include <string.h>
          #include <stdint.h>

          #include "audio_api.h"

          #define RING_FRAMES 8192          // power of two
          #define RING_MASK   (RING_FRAMES - 1)
          #define AQ_FRAMES   512
          #define AQ_BUFFERS  4

          static int16_t g_ring[RING_FRAMES * 2];
          static volatile uint32_t g_rd, g_wr;   // frame counters
          static AudioQueueRef g_aq;

          static inline uint32_t ring_avail(void) {
              return __atomic_load_n(&g_wr, __ATOMIC_ACQUIRE) - __atomic_load_n(&g_rd, __ATOMIC_RELAXED);
          }

          static void aq_callback(void *ud, AudioQueueRef q, AudioQueueBufferRef buf) {
              (void)ud;
              int16_t *out = (int16_t *)buf->mAudioData;
              uint32_t rd = __atomic_load_n(&g_rd, __ATOMIC_RELAXED);
              uint32_t n = ring_avail();
              if (n > AQ_FRAMES) n = AQ_FRAMES;
              for (uint32_t i = 0; i < n; i++) {
                  uint32_t idx = ((rd + i) & RING_MASK) * 2;
                  out[i * 2] = g_ring[idx];
                  out[i * 2 + 1] = g_ring[idx + 1];
              }
              if (n < AQ_FRAMES) memset(out + n * 2, 0, (AQ_FRAMES - n) * 4);   // underrun: silence
              __atomic_store_n(&g_rd, rd + n, __ATOMIC_RELEASE);
              buf->mAudioDataByteSize = AQ_FRAMES * 4;
              AudioQueueEnqueueBuffer(q, buf, 0, NULL);
          }

          static bool audio_ios32_init(void) {
              AVAudioSession *s = [AVAudioSession sharedInstance];
              [s setCategory:AVAudioSessionCategoryAmbient error:nil];   // respects the mute switch
              [s setActive:YES error:nil];

              AudioStreamBasicDescription f;
              memset(&f, 0, sizeof f);
              f.mSampleRate = 32000;
              f.mFormatID = kAudioFormatLinearPCM;
              f.mFormatFlags = kAudioFormatFlagIsSignedInteger | kAudioFormatFlagIsPacked;
              f.mBitsPerChannel = 16;
              f.mChannelsPerFrame = 2;
              f.mBytesPerFrame = 4;
              f.mFramesPerPacket = 1;
              f.mBytesPerPacket = 4;
              if (AudioQueueNewOutput(&f, aq_callback, NULL, NULL, NULL, 0, &g_aq) != noErr) return false;
              for (int i = 0; i < AQ_BUFFERS; i++) {
                  AudioQueueBufferRef b;
                  AudioQueueAllocateBuffer(g_aq, AQ_FRAMES * 4, &b);
                  memset(b->mAudioData, 0, AQ_FRAMES * 4);
                  b->mAudioDataByteSize = AQ_FRAMES * 4;
                  AudioQueueEnqueueBuffer(g_aq, b, 0, NULL);
              }
              return AudioQueueStart(g_aq, NULL) == noErr;
          }

          static int audio_ios32_buffered(void) { return (int)ring_avail(); }

          static int audio_ios32_get_desired_buffered(void) { return 1100; }

          static void audio_ios32_play(const uint8_t *buf, size_t len) {
              uint32_t frames = (uint32_t)(len / 4);
              uint32_t wr = __atomic_load_n(&g_wr, __ATOMIC_RELAXED);
              if (ring_avail() + frames > 6000) return;   // do not let latency grow unbounded
              const int16_t *in = (const int16_t *)buf;
              for (uint32_t i = 0; i < frames; i++) {
                  uint32_t idx = ((wr + i) & RING_MASK) * 2;
                  g_ring[idx] = in[i * 2];
                  g_ring[idx + 1] = in[i * 2 + 1];
              }
              __atomic_store_n(&g_wr, wr + frames, __ATOMIC_RELEASE);
          }

          static void audio_ios32_shutdown(void) {
              if (g_aq) { AudioQueueStop(g_aq, true); AudioQueueDispose(g_aq, true); g_aq = NULL; }
          }

          // Called from the UI thread on resign/become active.
          void ios32_audio_pause(int pause) {
              if (!g_aq) return;
              if (pause) AudioQueuePause(g_aq); else AudioQueueStart(g_aq, NULL);
          }

          struct AudioAPI audio_ios32 = {
              audio_ios32_init,
              audio_ios32_buffered,
              audio_ios32_get_desired_buffered,
              audio_ios32_play,
              audio_ios32_shutdown
          };

          #endif // AAPI_IOS32
          EOF_SM64
