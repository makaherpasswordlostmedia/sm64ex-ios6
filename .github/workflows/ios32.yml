          // ---------------------------------------------------------------------------
          // MFi controllers (GameController.framework exists on iOS 7+)
          // ---------------------------------------------------------------------------
          static int8_t axis80(float v) {
              if (fabsf(v) < 0.18f) return 0;
              return (int8_t)lrintf(v * 80.0f);
          }

          static void gc_attach(GCController *c) {
              ios32_input.pad_connected = 1;
              c.controllerPausedHandler = ^(GCController *ctl) { ios32_input.start_pulse = 4; };
              if (c.extendedGamepad) {
                  c.extendedGamepad.valueChangedHandler = ^(GCExtendedGamepad *p, GCControllerElement *el) {
                      uint16_t m = 0;
                      if (p.buttonA.pressed) m |= N64_A;
                      if (p.buttonX.pressed || p.buttonB.pressed) m |= N64_B;
                      if (p.leftShoulder.pressed || p.leftTrigger.pressed) m |= N64_Z;
                      if (p.rightShoulder.pressed || p.rightTrigger.pressed) m |= N64_R;
                      if (p.buttonY.pressed) m |= N64_CUP;
                      if (p.rightThumbstick.up.value > 0.5f)    m |= N64_CUP;
                      if (p.rightThumbstick.down.value > 0.5f)  m |= N64_CDOWN;
                      if (p.rightThumbstick.left.value > 0.5f)  m |= N64_CLEFT;
                      if (p.rightThumbstick.right.value > 0.5f) m |= N64_CRIGHT;
                      float x = p.leftThumbstick.xAxis.value, y = p.leftThumbstick.yAxis.value;
                      if (p.dpad.left.pressed)  x = -1;
                      if (p.dpad.right.pressed) x = 1;
                      if (p.dpad.up.pressed)    y = 1;
                      if (p.dpad.down.pressed)  y = -1;
                      ios32_input.pad_buttons = m;
                      ios32_input.pad_stick_x = axis80(x);
                      ios32_input.pad_stick_y = axis80(y);
                  };
              } else if (c.gamepad) {
                  c.gamepad.valueChangedHandler = ^(GCGamepad *p, GCControllerElement *el) {
                      uint16_t m = 0;
                      if (p.buttonA.pressed) m |= N64_A;
                      if (p.buttonX.pressed || p.buttonB.pressed) m |= N64_B;
                      if (p.leftShoulder.pressed) m |= N64_Z;
                      if (p.rightShoulder.pressed) m |= N64_R;
                      if (p.buttonY.pressed) m |= N64_CUP;
                      float x = 0, y = 0;
                      if (p.dpad.left.pressed)  x = -1;
                      if (p.dpad.right.pressed) x = 1;
                      if (p.dpad.up.pressed)    y = 1;
                      if (p.dpad.down.pressed)  y = -1;
                      ios32_input.pad_buttons = m;
                      ios32_input.pad_stick_x = axis80(x);
                      ios32_input.pad_stick_y = axis80(y);
                  };
              }
          }

