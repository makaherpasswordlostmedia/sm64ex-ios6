          // ios32_host.h - shared state between the UIKit host and the game backends.
          // Target: 32-bit iOS 7.0 - 9.3.5 (armv7). No SDL, no storyboards, no iOS 8+ API.
          #ifndef IOS32_HOST_H
          #define IOS32_HOST_H

          #include <stdint.h>
          #include <stdbool.h>

          #ifdef __OBJC__
          #import <UIKit/UIKit.h>
          UIView *ios32_gl_view(void);
          #endif

          // --- lifecycle ---------------------------------------------------------
          // Set to 1 from the main thread when the app resigns active. The game thread
          // must stop touching GL and acknowledge by raising ios32_game_idle.
          extern volatile int ios32_paused;
          extern volatile int ios32_game_idle;

          // --- paths / log ---------------------------------------------------------
          const char *ios32_user_dir(void);    // <app>/Documents
          const char *ios32_bundle_dir(void);  // <app>.app
          void ios32_log(const char *fmt, ...);

          // --- input state, written by UI/MFi, read by controller_ios32.c ---------------
          struct Ios32Input {
              volatile uint16_t touch_buttons;   // N64 button bitmask
              volatile int8_t   touch_stick_x;   // -80..80
              volatile int8_t   touch_stick_y;
              volatile uint16_t pad_buttons;     // MFi gamepad
              volatile int8_t   pad_stick_x;
              volatile int8_t   pad_stick_y;
              volatile int      pad_connected;
              volatile int      start_pulse;     // frames left to hold START (MFi pause button)
          };
          extern struct Ios32Input ios32_input;

          // --- implemented in pc_main_ios32.m ----------------------------------------
          void ios32_game_main(void);          // runs on the game thread, never returns

          #endif
