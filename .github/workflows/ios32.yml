          cat > src/pc/controller/controller_entry_point.m <<'EOF_SM64'
          #include "lib/src/libultra_internal.h"
          #include "lib/src/osContInternal.h"
          #include "macros.h"

          #include "../configfile.h"

          #include "controller_recorded_tas.h"
          #include "controller_keyboard.h"
          #include "controller_sdl.h"
          #ifdef CAPI_IOS32
          #include "controller_ios32.h"
          #endif
          #ifdef TARGET_OS_IOS
          #include "controller_touchscreen.h"
          #endif

          // Analog camera movement by Pathétique (github.com/vrmiguel), y0shin and Mors
          // Contribute or communicate bugs at github.com/vrmiguel/sm64-analog-camera

          static struct ControllerAPI *controller_implementations[] = {
              &controller_recorded_tas,
              #if defined(CAPI_SDL2) || defined(CAPI_SDL1)
              &controller_sdl,
              #endif
              &controller_keyboard,
          #ifdef CAPI_IOS32
              &controller_ios32,
          #endif
          #ifdef TARGET_OS_IOS
              &controller_touchscreen,
          #endif
          };

          s32 osContInit(UNUSED OSMesgQueue *mq, u8 *controllerBits, UNUSED OSContStatus *status) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++)
                  controller_implementations[i]->init();
              *controllerBits = 1;
              return 0;
          }

          s32 osMotorStart(UNUSED void *pfs) {
              // Since rumble stops by osMotorStop, its duration is not nessecary.
              // Set it to 5 seconds and hope osMotorStop() is called in time.
              if (configRumbleStrength)
                  controller_rumble_play(configRumbleStrength / 100.0f, 5.0f);
              return 0;
          }

          s32 osMotorStop(UNUSED void *pfs) {
              if (configRumbleStrength)
                  controller_rumble_stop();
              return 0;
          }

          u32 osMotorInit(UNUSED OSMesgQueue *mq, UNUSED void *pfs, UNUSED s32 port) {
              return 0; // rumble is initialized in the specific backend's init function
          }

          s32 osContStartReadData(UNUSED OSMesgQueue *mesg) {
              return 0;
          }

          void osContGetReadData(OSContPad *pad) {
              pad->button = 0;
              pad->stick_x = 0;
              pad->stick_y = 0;
              pad->ext_stick_x = 0;
              pad->ext_stick_y = 0;
              pad->errnum = 0;

              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  controller_implementations[i]->read(pad);
              }
          }

          u32 controller_get_raw_key(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  u32 vk = controller_implementations[i]->rawkey();
                  if (vk != VK_INVALID) return vk + controller_implementations[i]->vkbase;
              }
              return VK_INVALID;
          }

          void controller_shutdown(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->shutdown)
                      controller_implementations[i]->shutdown();
              }
          }

          void controller_reconfigure(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->reconfig)
                      controller_implementations[i]->reconfig();
              }
          }

          void controller_rumble_play(float str, float time) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->rumble_play)
                      controller_implementations[i]->rumble_play(str, time);
              }
          }

          void controller_rumble_stop(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->rumble_stop)
                      controller_implementations[i]->rumble_stop();
              }
          }
          EOF_SM64
          cat > README_IOS32.md <<'EOF_SM64'
          # SM64 (sm64ex-ios) → 32-bit iOS 7.0 – 9.3.5 (armv7)

          Порт без SDL2 и без storyboard'ов: нативный хост на UIKit / EAGL (OpenGL ES 2) /
          AudioQueue / GameController. Схема и тулчейн взяты из Crash Bandicoot armv7 порта
          (Theos-тулчейн на Linux + iPhoneOS 9.3 SDK, Mach-O min version 7.0).

          > ROM в репозитории нет. Нужен твой собственный дамп `baserom.us.z64` (US).
          > Ассеты извлекаются при сборке и вшиваются в бинарник, на устройство ROM класть не надо.

          ## Что изменено относительно sm64ex-ios

          | Файл | Что |
          |------|-----|
          | `src/pc/ios32/ios32_host.{h,m}` | `main()`, UIApplication, GL-view, экранный N64-пад (стик + A/B/Z/R/C/START), MFi, пауза/фон |
          | `src/pc/gfx/gfx_ios32.{h,m}` | WAPI: EAGLContext, FBO + depth16, present, 30 FPS на игровом потоке, 1x-рендер на больших retina iPad |
          | `src/pc/audio/audio_ios32.{h,m}` | AudioQueue 32 кГц stereo, lock-free ring buffer |
          | `src/pc/controller/controller_ios32.{h,c}` | читает состояние хоста в `OSContPad` |
          | `src/pc/pc_main_ios32.m` | `main_func` без SDL/CADisplayLink; оригинальный `pc_main.m` обёрнут `#ifndef TARGET_IOS32` |
          | `Makefile` | `TARGET_IOS32=1`: бэкенды IOS32, host-tools на gcc, цель `make ios32` (.app/.ipa + ldid) |
          | `platform.c`, `gfx_opengl.c`, `controller_entry_point.m` | мелкие ветки под `TARGET_IOS32` |
          | `ios32/` | Info.plist (min iOS 7.0, landscape, file sharing), entitlements, launch images |
          | `build_ios32.sh`, `.github/workflows/ios32.yml` | локальная и CI-сборка |

          ## Сборка (Linux)

          ```bash
          # Theos + toolchain + SDK как в Crash-порте
          export THEOS=$HOME/theos
          cp /path/to/your/rom.z64 baserom.us.z64
          ./build_ios32.sh
          # -> build/us_pc/sm64ios32.ipa
          ```

          Нужны: python3, gcc (для host-tools), zip, ldid (лежит в тулчейне), hexdump.

          ## Установка

          Как у Crash: подпиши `.ipa` своим Apple ID инструментом, который умеет твою версию iOS,
          или поставь на джейлбрейке. Сейвы и конфиг лежат в `Documents/` (iTunes File Sharing / Filza),
          лог — `Documents/sm64.log`.

          ## Управление

          Левая часть экрана — плавающий аналоговый стик (появляется под пальцем).
          Справа: A, B, Z, R, кластер C-кнопок, START внизу по центру. Мультитач.
          MFi: левый стик/dpad — движение, A — A, X/B — B, плечи — Z/R, правый стик — C, pause — START.

          ## Статус / честно

          - Все новые и изменённые файлы **скомпилированы** тулчейном под `armv7-apple-ios7.0`
            против iPhoneOS 9.3 SDK без ошибок; Makefile отработал dry-run до извлечения ассетов.
          - **Полная сборка и запуск на железе не проверялись**: нет ROM и нет устройства.
            Ожидай мелких правок на первом реальном билде.
          - Чит-меню и haptics из sm64ex-ios в этом билде убраны. Вместо них есть панель настроек
            тач-управления (см. ниже) и встроенные настройки игры (EXT_OPTIONS_MENU).
          - Рамбл — заглушка (на iOS 7 нет CoreHaptics).
          - Целевое минимум — A5 (iPhone 4S, iPad 2, iPad mini 1). Рендер: GLES2, mediump.

          ## Настройки тач-управления (взято из TouchControlSettings Crash-порта)

          Кнопка ⚙ в левом верхнем углу открывает панель: показать/скрыть пад, прозрачность (0.2–1.0),
          размер кнопок (0.7–1.4), размер стика (0.7–1.6), плавающий/фиксированный стик, леворукая раскладка,
          показ C-кнопок, сброс. Сохраняется в `Documents/touch_settings.cfg` сразу по «Done».
          Код: `src/pc/ios32/ios32_settings.{h,m}` + панель в `ios32_host.m`.

          ## Сборка на GitHub

          Actions → **Build SM64 (iOS 7-9.3.5 armv7)** → Run workflow. Выбери регион (us проверен по раскладке,
          jp/eu экспериментально), вставь Drive file ID своего `baserom.<регион>.z64` или один раз положи его
          в секрет `DRIVE_ROM_ID`. Workflow лежит в `.github/workflows/ios32.yml` и должен быть в дефолтной ветке.
          Тулчейн и SDK кешируются, ROM проверяется по SHA1 и удаляется с раннера, Mach-O проверяется,
          артефакты: `SM64-armv7-<регион>-<sha>.ipa` и `build-logs-ios32-<регион>` (лог сборки).

          ## Читы

          В панели ⚙ есть кнопка **Cheats**: мастер-переключатель, moon jump, god mode, infinite lives, super speed,
          responsive controls, exit course anywhere, huge/tiny Mario. Это те же читы, что уже есть в игре
          (`src/pc/cheats.c`), состояние сохраняется в `touch_settings.cfg`. Дополнительно на экране появилась
          кнопка **L** (раньше её не было, из-за чего меню читов в опциях нельзя было открыть).
