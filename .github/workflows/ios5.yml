          +// ---------------------------------------------------------------------------
          +// Landscape-only navigation controller (iOS 5 rotation API)
          +// ---------------------------------------------------------------------------
          +@interface IOS5NavigationController : UINavigationController
          +@end
          +
          +@implementation IOS5NavigationController
          +- (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)o {
          +    return UIInterfaceOrientationIsLandscape(o);
          +}
          +@end
