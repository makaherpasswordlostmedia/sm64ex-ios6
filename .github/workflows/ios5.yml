          +
          +- (void)loadView {
          +    UIView *v = [[[UIView alloc] initWithFrame:[[UIScreen mainScreen] bounds]] autorelease];
          +    v.backgroundColor = [UIColor groupTableViewBackgroundColor];
          +    v.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
          +    self.view = v;
          +    self.title = @"About";
          +
          +    NSString *ver = [[[NSBundle mainBundle] infoDictionary] objectForKey:@"CFBundleShortVersionString"];
          +    if (ver == nil) ver = @"1.0.0";
          +
          +    NSArray *lines = [NSArray arrayWithObjects:@"Super Mario 64 iOS", [@"Version " stringByAppendingString:ver], @"iOS 5 (armv7) port", nil];
          +    CGFloat y = 40;
          +    for (NSUInteger i = 0; i < [lines count]; i++) {
          +        UILabel *l = [[[UILabel alloc] initWithFrame:CGRectMake(0, y, v.bounds.size.width, 30)] autorelease];
          +        l.text = [lines objectAtIndex:i];
          +        l.textAlignment = (NSInteger)1;   // == UITextAlignmentCenter (iOS 5) == NSTextAlignmentCenter (iOS 6+)
          +        l.backgroundColor = [UIColor clearColor];
          +        l.font = (i == 0) ? [UIFont boldSystemFontOfSize:22] : [UIFont systemFontOfSize:15];
          +        l.autoresizingMask = UIViewAutoresizingFlexibleWidth;
          +        [v addSubview:l];
          +        y += (i == 0) ? 36 : 24;
          +    }
          +    UIButton *b = [UIButton buttonWithType:UIButtonTypeRoundedRect];
          +    b.frame = CGRectMake((v.bounds.size.width - 160) / 2, y + 16, 160, 40);
          +    b.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin | UIViewAutoresizingFlexibleRightMargin;
          +    [b setTitle:@"Source code" forState:UIControlStateNormal];
          +    [b addTarget:self action:@selector(sourcePressed) forControlEvents:UIControlEventTouchUpInside];
          +    [v addSubview:b];
          +}
          +
          +- (void)sourcePressed {
          +    [[UIApplication sharedApplication] openURL:[NSURL URLWithString:@"https://github.com/ckosmic/sm64ex-ios"]];
          +}
          +@end
