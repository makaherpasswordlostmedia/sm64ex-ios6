          +// ---------------------------------------------------------------------------
          +// Generic "list of switches" table. Each row: title + getter/setter blocks.
          +// ---------------------------------------------------------------------------
          +typedef bool (^IOS5GetBlock)(void);
          +typedef void (^IOS5SetBlock)(bool);
          +
          +@interface IOS5SwitchRow : NSObject
          +@property (nonatomic, copy) NSString *title;
          +@property (nonatomic, copy) IOS5GetBlock getter;
          +@property (nonatomic, copy) IOS5SetBlock setter;
          +@end
          +
          +@implementation IOS5SwitchRow
          +@synthesize title, getter, setter;
          +- (void)dealloc { [title release]; [getter release]; [setter release]; [super dealloc]; }
          +@end
          +
          +static IOS5SwitchRow *ios5_row(NSString *title, IOS5GetBlock g, IOS5SetBlock s) {
          +    IOS5SwitchRow *r = [[[IOS5SwitchRow alloc] init] autorelease];
          +    r.title = title; r.getter = g; r.setter = s;
          +    return r;
          +}
          +
          +@interface IOS5SwitchListViewController : UITableViewController
          +@property (nonatomic, retain) NSArray *rows;
          +@end
          +
          +@implementation IOS5SwitchListViewController
          +@synthesize rows;
          +
          +- (void)dealloc { [rows release]; [super dealloc]; }
          +
          +- (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)o {
          +    return UIInterfaceOrientationIsLandscape(o);
          +}
          +
          +- (void)viewWillAppear:(BOOL)animated {
          +    [super viewWillAppear:animated];
          +    [self.tableView reloadData];
          +}
          +
          +- (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return [rows count]; }
          +
          +- (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
          +    static NSString *ident = @"switchcell";
          +    UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:ident];
          +    if (cell == nil) {
          +        cell = [[[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:ident] autorelease];
          +        cell.selectionStyle = UITableViewCellSelectionStyleNone;
          +        cell.accessoryView = [[[UISwitch alloc] initWithFrame:CGRectZero] autorelease];
          +    }
          +    IOS5SwitchRow *row = [rows objectAtIndex:ip.row];
          +    cell.textLabel.text = row.title;
          +    UISwitch *sw = (UISwitch *)cell.accessoryView;
          +    [sw removeTarget:nil action:NULL forControlEvents:UIControlEventValueChanged];
          +    sw.on = row.getter();
          +    sw.tag = ip.row;
          +    [sw addTarget:self action:@selector(switchChanged:) forControlEvents:UIControlEventValueChanged];
          +    return cell;
          +}
          +
          +- (void)switchChanged:(UISwitch *)sw {
          +    IOS5SwitchRow *row = [rows objectAtIndex:sw.tag];
          +    row.setter(sw.on);
          +}
          +@end
          +
          +// ---------------------------------------------------------------------------
          +// Generic single-choice list (checkmark). Used for texture filter + touch mode.
          +// ---------------------------------------------------------------------------
          +@interface IOS5ChoiceViewController : UITableViewController
          +@property (nonatomic, retain) NSArray *choices;
          +@property (nonatomic, assign) unsigned int *value;
          +@end
          +
          +@implementation IOS5ChoiceViewController
          +@synthesize choices, value;
          +
          +- (void)dealloc { [choices release]; [super dealloc]; }
          +
          +- (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)o {
          +    return UIInterfaceOrientationIsLandscape(o);
          +}
          +
          +- (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return [choices count]; }
          +
          +- (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
          +    static NSString *ident = @"choicecell";
          +    UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:ident];
          +    if (cell == nil)
          +        cell = [[[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:ident] autorelease];
          +    cell.textLabel.text = [choices objectAtIndex:ip.row];
          +    cell.accessoryType = ((unsigned int)ip.row == *value) ? UITableViewCellAccessoryCheckmark : UITableViewCellAccessoryNone;
          +    return cell;
          +}
          +
          +- (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
          +    *value = (unsigned int)ip.row;
          +    configfile_save(configfile_name());
          +    [tv deselectRowAtIndexPath:ip animated:YES];
          +    [tv reloadData];
          +}
          +@end
