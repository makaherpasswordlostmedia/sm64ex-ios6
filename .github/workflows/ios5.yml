      - name: Generate @1x/@2x images and icons
        run: |
          pip3 install pillow --break-system-packages 2>/dev/null || pip3 install pillow
          python3 - <<'PY_EOF'
          import glob
          from PIL import Image
          src='sm64ios/sm64ios/Assets.xcassets'; out='ios5_resources'
          for n in ['touch_button','touch_button_dark','touch_joystick','icon_a','icon_b','icon_l','icon_r','icon_z','icon_start','icon_menu','icon_arrow']:
              im=Image.open(glob.glob(f'{src}/{n}.imageset/*.png')[0]).convert('RGBA')
              im.save(f'{out}/{n}@2x.png')
              im.resize((im.width//2,im.height//2),Image.LANCZOS).save(f'{out}/{n}.png')
          for nm,sz in (('Default.png',(320,480)),('Default@2x.png',(640,960)),('Default-Landscape.png',(1024,748)),('Default-Landscape@2x.png',(2048,1496))):
              Image.new('RGB',sz,(0,0,0)).save(f'{out}/{nm}')
          art=Image.open(glob.glob(f'{src}/LSImage.imageset/*.png')[0]).convert('RGBA')
          for nm,px in (('Icon.png',57),('Icon@2x.png',114),('Icon-72.png',72),('Icon-72@2x.png',144)):
              c=Image.new('RGBA',(px,px),(200,30,30,255)); a=art.copy(); a.thumbnail((int(px*.9),int(px*.9)),Image.LANCZOS)
              c.paste(a,((px-a.width)//2,(px-a.height)//2),a); c.convert('RGB').save(f'{out}/{nm}')
          PY_EOF

      - name: Build SDL2 ${{ env.SDL_VER }} (armv7, iOS ${{ env.MINVER }})
        run: |
          curl -fsSL https://libsdl.org/release/SDL2-$SDL_VER.tar.gz | tar xz
          cd SDL2-$SDL_VER/Xcode-iOS/SDL
          xcodebuild -project SDL.xcodeproj -target libSDL -configuration Release -sdk iphoneos \
            ARCHS=armv7 VALID_ARCHS=armv7 ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=$MINVER \
            CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/build build
          cd $GITHUB_WORKSPACE
          mkdir -p ioslib5/include/SDL2 ioslib5/lib
          cp SDL2-$SDL_VER/include/*.h ioslib5/include/SDL2/
          cp "$(find SDL2-$SDL_VER/Xcode-iOS/SDL/build -name 'libSDL2.a' | head -1)" ioslib5/lib/

      - name: Build game
        env:
          BASEROM_US_B64: ${{ secrets.BASEROM_US_B64 }}
        run: |
          [ -n "$BASEROM_US_B64" ] || { echo "Add secret BASEROM_US_B64"; exit 1; }
          echo "$BASEROM_US_B64" | base64 -d > baserom.us.z64
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          COMMON="-arch armv7 -miphoneos-version-min=$MINVER -isysroot $SDK -fno-objc-arc -fcommon -Wno-deprecated-declarations -Wno-error"
          DEFS="-DUSE_GLES -DAAPI_SDL2 -DWAPI_SDL2 -DTARGET_OS_IOS -DIOS5_COMPAT"
          export CC="clang $COMMON $DEFS" CXX="clang++ $COMMON $DEFS -std=c++11"
          export IOSINCLUDE="$PWD/ioslib5/include" IOSLIBS="$PWD/ioslib5/lib" TARGET_OS_IOS=1
          gmake -j4 TARGET_IOS=1 TARGET_OS_IOS=1 IOS5=1

      - name: Package .ipa
        run: |
          B=build/us_pc; APP=build/sm64ios.app; rm -rf $APP; mkdir -p $APP
          if [ -d $B/sm64ios ]; then cp -R $B/sm64ios/. $APP/; else cp $B/sm64ios $APP/sm64ios; fi
          [ -d $B/res ] && cp -R $B/res $APP/ || true
          cp ios5_resources/*.png ios5_resources/Info.plist $APP/
          ldid -S $APP/sm64ios
          mkdir build/Payload && cp -R $APP build/Payload/ && (cd build && zip -qr sm64ios5.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: sm64ios5-ipa
          path: build/sm64ios5.ipa
