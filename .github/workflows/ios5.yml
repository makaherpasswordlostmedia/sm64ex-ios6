# Single-file iOS 5 (armv7) build of sm64ex-ios.
# Put this ONE file at .github/workflows/ios5.yml in your sm64ex-ios6-ios repo. It carries the whole port
# (patch + new files + resources generator) and applies it on the runner. Nothing else to copy.
#
# Secrets needed: BASEROM_US_B64  (base64 of YOUR baserom.us.z64:  base64 -i baserom.us.z64 | pbcopy)
# NOT verified by me: hosted macOS runners may no longer ship an Xcode that can still target armv7 / iOS 5.
# If "Select Xcode" fails, run this on a self-hosted Mac with Xcode 9.4 or older (change runs-on).
name: sm64ex iOS5 build
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
jobs:
  build:
    runs-on: ${{ vars.IOS5_RUNNER || 'macos-12' }}
    env:
      SDL_VER: 2.0.8
      MINVER: "5.0"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode that can still build armv7
        run: |
          for x in /Applications/Xcode_9*.app /Applications/Xcode_10.1*.app /Applications/Xcode_13*.app; do
            [ -d "$x" ] && sudo xcode-select -s "$x" && break
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path || { echo "No iphoneos SDK"; exit 1; }
          brew install make ldid || true

      - name: Apply iOS 5 port
        run: |
          cat > ios5.patch <<'PATCH_EOF'
          --- a/Makefile
          +++ b/Makefile
          @@ -29,6 +29,8 @@

           # Build for iOS devices
           TARGET_IOS ?= 1
          +# Build for iOS 5.x (armv7). Use build_ios5.sh.
          +IOS5 ?= 0

           # Makeflag to enable OSX fixes
           OSX_BUILD ?= 1
          @@ -551,8 +553,16 @@
               BACKEND_LDFLAGS += -lGLESv2
             else ifeq ($(TARGET_IOS),1)
           	ifeq ($(TARGET_OS_IOS),1)
          +      ifeq ($(IOS5),1)
          +        # iOS 5.x / armv7: only frameworks that exist on iOS 5. No CoreHaptics (iOS 13),
          +        # Metal (iOS 8), GameController (iOS 7), IOKit (private on iOS).
          +        IOS5_STDLIB ?= -lc++
          +        BACKEND_LDFLAGS += -framework OpenGLES -framework AVFoundation -framework AudioToolbox -framework CoreFoundation -framework CoreGraphics -framework CoreAudio -framework Foundation -framework UIKit -framework QuartzCore -framework CoreMotion $(IOS5_EXTRA_LDFLAGS) -L. -lSDL2 $(IOS5_STDLIB)
          +        BACKEND_CFLAGS += -DTARGET_OS_IOS -DIOS5_COMPAT
          +      else
                 BACKEND_LDFLAGS += -framework OpenGLES -framework AVFoundation -framework AudioToolbox -framework CoreFoundation -framework CoreGraphics -framework CoreBluetooth -framework CoreAudio -framework IOKit -framework GameController -framework Foundation -framework UIKit -framework QuartzCore -framework CoreMotion -framework CoreHaptics -framework Metal -L. -lSDL2 -lc++ -lstdc++ -D.
                 BACKEND_CFLAGS += -DTARGET_OS_IOS
          +      endif
               else
           	  BACKEND_LDFLAGS += -framework OpenGLES -framework AVFoundation -framework AudioToolbox -framework CoreFoundation -framework CoreGraphics -framework CoreBluetooth -framework CoreAudio -framework GameController -framework Foundation -framework UIKit -framework QuartzCore -framework CoreHaptics -framework Metal -L. -lSDL2 -lc++ -lstdc++ -D.
           	  BACKEND_CFLAGS += -DTARGET_OS_TV
