          // sm64app.h - Symbian^3 front end for the Super Mario 64 (sm64ex) port.
          // Everything (UI, EGL, game, audio callbacks) runs on the UI thread.
          #ifndef SM64APP_SYMBIAN_H
          #define SM64APP_SYMBIAN_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <mdaaudiooutputstream.h>

          #include "sym_host.h"

          const TUid KUidSm64 = { (TInt32)0xE5A64D64 };

          // ---------------------------------------------------------------------------
          // GL overlay (touch pad, menu, fps): own tiny shader, saves/restores all game GL state.
          // ---------------------------------------------------------------------------
          namespace Ovl
              {
              TBool Init();
              void Release();
              void Begin(TInt aW, TInt aH);
              void Quad(TReal32 aX0, TReal32 aY0, TReal32 aX1, TReal32 aY1, TUint32 aRgba);
              void Circle(TReal32 aCx, TReal32 aCy, TReal32 aR, TUint32 aRgba);
              void Text(TReal32 aX, TReal32 aY, TReal32 aScale, const char* aStr, TUint32 aRgba);
              TReal32 TextWidth(const char* aStr, TReal32 aScale);
              void End();
              }

          #define OVL_RGBA(r, g, b, a) ((((TUint32)(a)) << 24) | (((TUint32)(b)) << 16) | (((TUint32)(g)) << 8) | ((TUint32)(r)))

          // Pulls PCM from the game's ring buffer into a CMdaAudioOutputStream (44.1 kHz stereo).
          class CSm64Audio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CSm64Audio* NewL();
              ~CSm64Audio();
              void Suspend();
              void Resume();

              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              CSm64Audio();
              void OpenStream();
              void Fill(TInt aSlot);

              enum { KSlots = 4, KFrames = 1024, KBytes = 1024 * 4 };
              CMdaAudioOutputStream* iStream;
              TBool iReady;
              TBool iSuspended;
              TUint8 iBuf[KSlots][KBytes];
              TPtrC8 iDes[KSlots];
              };

