          // CMdaAudioOutputStream, 44.1 kHz stereo PCM16, pulled from the game's ring buffer (UI thread).
          #include "sm64app.h"

          static const TInt KRate44100 = 0x00000020;   // TMdaAudioDataSettings::ESampleRate44100Hz
          static const TInt KStereo = 0x00000002;      // TMdaAudioDataSettings::EChannelsStereo

          CSm64Audio* CSm64Audio::NewL()
              {
              CSm64Audio* self = new (ELeave) CSm64Audio;
              self->OpenStream();
              return self;
              }

          CSm64Audio::CSm64Audio()
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  Mem::FillZ(iBuf[i], KBytes);
                  iDes[i].Set(iBuf[i], KBytes);
                  }
              }

          CSm64Audio::~CSm64Audio()
              {
              if (iStream)
                  {
                  iStream->Stop();
                  delete iStream;
                  }
              }

          void CSm64Audio::OpenStream()
              {
              iReady = EFalse;
              delete iStream;
              iStream = NULL;
              TRAPD(err, iStream = CMdaAudioOutputStream::NewL(*this));
              if (err == KErrNone && iStream) iStream->Open(NULL);
              }

          void CSm64Audio::Fill(TInt aSlot)
              {
              Sym_AudioPull((short*)iBuf[aSlot], KFrames);
              TRAPD(err, iStream->WriteL(iDes[aSlot]));
              (void)err;
              }

          void CSm64Audio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone)
                  {
                  sym_log("[AUD] open failed %d", (int)aError);
                  return;
                  }
              TRAPD(err, iStream->SetAudioPropertiesL(KRate44100, KStereo));
              if (err != KErrNone)
                  {
                  sym_log("[AUD] SetAudioPropertiesL failed %d", (int)err);
                  return;
                  }
              iStream->SetVolume(iStream->MaxVolume() / 2);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iReady = ETrue;
              sym_log("[AUD] stream ready");
              for (TInt i = 0; i < KSlots; ++i) Fill(i);
              }

          void CSm64Audio::MaoscBufferCopied(TInt aError, const TDesC8& aBuffer)
              {
              if (aError != KErrNone || !iReady || iSuspended) return;
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iBuf[i] == aBuffer.Ptr())
                      {
                      Fill(i);
                      return;
                      }
                  }
              }

          void CSm64Audio::MaoscPlayComplete(TInt /*aError*/) {}

          void CSm64Audio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream && iReady)
                  {
                  iStream->Stop();
                  iReady = EFalse;
                  }
              }

          void CSm64Audio::Resume()
              {
              if (iSuspended)
                  {
                  iSuspended = EFalse;
                  OpenStream();
                  }
              }
          EOF_SM64
