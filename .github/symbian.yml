          // EGL / OpenGL ES 2.0 host. Single context, window surface, UI thread only (VideoCore III hangs otherwise).
          #include <e32std.h>
          #include <w32std.h>
          #include <EGL/egl.h>
          #include "sym_host.h"

          static EGLDisplay gDpy = EGL_NO_DISPLAY;
          static EGLSurface gSurf = EGL_NO_SURFACE;
          static EGLContext gCtx = EGL_NO_CONTEXT;
          static EGLConfig gCfg;
          static int gW = 640, gH = 360;
          static int gUp = 0;

          static EGLBoolean Choose(const EGLint* aAttr, EGLConfig* aOut)
              {
              EGLint n = 0;
              return eglChooseConfig(gDpy, aAttr, aOut, 1, &n) && n > 0;
              }

          static void LogCfg(EGLConfig c)
              {
              EGLint id = 0, r = 0, g = 0, b = 0, a = 0, d = 0, st = 0;
              eglGetConfigAttrib(gDpy, c, EGL_CONFIG_ID, &id);
              eglGetConfigAttrib(gDpy, c, EGL_RED_SIZE, &r);   eglGetConfigAttrib(gDpy, c, EGL_GREEN_SIZE, &g);
              eglGetConfigAttrib(gDpy, c, EGL_BLUE_SIZE, &b);  eglGetConfigAttrib(gDpy, c, EGL_ALPHA_SIZE, &a);
              eglGetConfigAttrib(gDpy, c, EGL_DEPTH_SIZE, &d); eglGetConfigAttrib(gDpy, c, EGL_STENCIL_SIZE, &st);
              sym_log("[EGL] config id=%d rgba=%d/%d/%d/%d depth=%d stencil=%d", (int)id, (int)r, (int)g, (int)b, (int)a, (int)d, (int)st);
              }

          extern "C" const char* Sym_GlInit(void* aWindow)
              {
              gDpy = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              if (gDpy == EGL_NO_DISPLAY) return "EGL: no display";
              EGLint maj = 0, min = 0;
              if (!eglInitialize(gDpy, &maj, &min)) return "EGL: eglInitialize failed";
              {
                  const char* ev = eglQueryString(gDpy, EGL_VENDOR);
                  const char* evr = eglQueryString(gDpy, EGL_VERSION);
                  sym_log("[EGL] %d.%d vendor=%s version=%s", (int)maj, (int)min, ev ? ev : "?", evr ? evr : "?");
              }
              eglBindAPI(EGL_OPENGL_ES_API);

              // depth buffer is mandatory (SM64 uses z-buffering); prefer 16-bit colour for fill rate.
              const EGLint a565d16[] = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                                         EGL_RED_SIZE, 5, EGL_GREEN_SIZE, 6, EGL_BLUE_SIZE, 5, EGL_DEPTH_SIZE, 16, EGL_NONE };
              const EGLint a565d[]   = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                                         EGL_RED_SIZE, 5, EGL_GREEN_SIZE, 6, EGL_BLUE_SIZE, 5, EGL_DEPTH_SIZE, 1, EGL_NONE };
              const EGLint aAnyd16[] = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                                         EGL_DEPTH_SIZE, 16, EGL_NONE };
              const EGLint aAnyd[]   = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                                         EGL_DEPTH_SIZE, 1, EGL_NONE };
              if (!(Choose(a565d16, &gCfg) || Choose(a565d, &gCfg) || Choose(aAnyd16, &gCfg) || Choose(aAnyd, &gCfg)))
                  return "EGL: no ES 2.0 window config with a depth buffer";
              LogCfg(gCfg);

              gSurf = eglCreateWindowSurface(gDpy, gCfg, (EGLNativeWindowType)aWindow, NULL);
              if (gSurf == EGL_NO_SURFACE)
                  {
                  sym_log("[EGL] eglCreateWindowSurface failed: 0x%x", (unsigned)eglGetError());
                  return "EGL: eglCreateWindowSurface failed";
                  }
              const EGLint ctxAttr[] = { EGL_CONTEXT_CLIENT_VERSION, 2, EGL_NONE };
              gCtx = eglCreateContext(gDpy, gCfg, EGL_NO_CONTEXT, ctxAttr);
              if (gCtx == EGL_NO_CONTEXT) return "EGL: eglCreateContext (ES 2.0) failed";
              if (!eglMakeCurrent(gDpy, gSurf, gSurf, gCtx))
                  {
                  sym_log("[EGL] eglMakeCurrent failed: 0x%x", (unsigned)eglGetError());
                  return "EGL: eglMakeCurrent failed";
                  }
              eglQuerySurface(gDpy, gSurf, EGL_WIDTH, &gW);
              eglQuerySurface(gDpy, gSurf, EGL_HEIGHT, &gH);
              eglSwapInterval(gDpy, 0);
              sym_log("[EGL] ready, surface %dx%d", (int)gW, (int)gH);
              gUp = 1;
              return NULL;
              }

          extern "C" void Sym_GlShutdown(void)
              {
              if (gDpy == EGL_NO_DISPLAY) return;
              gUp = 0;
              eglMakeCurrent(gDpy, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
              if (gCtx != EGL_NO_CONTEXT) eglDestroyContext(gDpy, gCtx);
              if (gSurf != EGL_NO_SURFACE) eglDestroySurface(gDpy, gSurf);
              eglTerminate(gDpy);
              gCtx = EGL_NO_CONTEXT;
              gSurf = EGL_NO_SURFACE;
              gDpy = EGL_NO_DISPLAY;
              }

          extern "C" void Sym_GlSize(int* w, int* h)
              {
              *w = gW;
              *h = gH;
              }

          extern "C" int Sym_GlSwap(void)
              {
              if (!gUp) return 0;
              if (!eglSwapBuffers(gDpy, gSurf))
                  {
                  static int logged;
                  if (logged++ < 8) sym_log("[EGL] eglSwapBuffers failed: 0x%x", (unsigned)eglGetError());
                  return 0;
                  }
              return 1;
              }
          EOF_SM64
          mkdir -p "$(dirname symbian/app/src/sm64_overlay.cpp)"
          cat > symbian/app/src/sm64_overlay.cpp <<'EOF_SM64'
          // GL overlay renderer. Own program + font texture; saves and restores every piece of GL state the game's
          // renderer (gfx_opengl.c) relies on, so the game never notices.
          #include <e32std.h>
          #include <e32math.h>
          #include <GLES2/gl2.h>
          #include "sm64app.h"
          #include "sm64_font.h"

          namespace
          {
          const int KMaxVerts = 6 * 700;
          const int KTexW = 128, KTexH = 76;   // 72 rows of glyphs + 4 solid rows
          struct Vtx { float x, y, u, v; TUint32 c; };

          GLuint gProg = 0, gTex = 0;
          GLint gLocScr = -1, gLocTex = -1;
          Vtx gV[KMaxVerts];
          int gN = 0;
          int gW = 1, gH = 1;
          float gSolidU = 0, gSolidV = 0;

          // saved state
          GLint sProg, sArr, sElem, sActive, sTex0, sBlendSrcC, sBlendDstC, sBlendSrcA, sBlendDstA, sBlendEqC, sBlendEqA;
          GLint sVp[4];
          GLboolean sBlend, sDepth, sCull, sScissor, sDMask, sCMask[4];
          GLint sAttrEn[8];

          GLuint Compile(GLenum aType, const char* aSrc)
              {
              GLuint s = glCreateShader(aType);
              glShaderSource(s, 1, &aSrc, NULL);
              glCompileShader(s);
              GLint ok = 0;
              glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
              if (!ok)
                  {
                  char log[256];
                  GLsizei n = 0;
                  glGetShaderInfoLog(s, sizeof log - 1, &n, log);
                  log[n] = 0;
                  sym_log("[OVL] shader error: %s", log);
                  glDeleteShader(s);
                  return 0;
                  }
              return s;
              }

          void Flush()
              {
              if (!gN) return;
              glVertexAttribPointer(0, 2, GL_FLOAT, GL_FALSE, sizeof(Vtx), &gV[0].x);
              glVertexAttribPointer(1, 2, GL_FLOAT, GL_FALSE, sizeof(Vtx), &gV[0].u);
              glVertexAttribPointer(2, 4, GL_UNSIGNED_BYTE, GL_TRUE, sizeof(Vtx), &gV[0].c);
              glDrawArrays(GL_TRIANGLES, 0, gN);
              gN = 0;
              }

          void Tri(float x0, float y0, float u0, float v0, float x1, float y1, float u1, float v1,
                   float x2, float y2, float u2, float v2, TUint32 c)
              {
              if (gN + 3 > KMaxVerts) Flush();
              Vtx* p = &gV[gN];
              p[0].x = x0; p[0].y = y0; p[0].u = u0; p[0].v = v0; p[0].c = c;
              p[1].x = x1; p[1].y = y1; p[1].u = u1; p[1].v = v1; p[1].c = c;
              p[2].x = x2; p[2].y = y2; p[2].u = u2; p[2].v = v2; p[2].c = c;
              gN += 3;
              }
          }

          TBool Ovl::Init()
              {
              if (gProg) return ETrue;
              static const char* vs =
                  "attribute vec2 aPos; attribute vec2 aUv; attribute vec4 aCol;\n"
                  "uniform vec2 uScr; varying vec2 vUv; varying vec4 vCol;\n"
                  "void main(){ vec2 p = aPos / uScr; gl_Position = vec4(p.x*2.0-1.0, 1.0-p.y*2.0, 0.0, 1.0); vUv = aUv; vCol = aCol; }\n";
              static const char* fs =
                  "precision mediump float; varying vec2 vUv; varying vec4 vCol; uniform sampler2D uTex;\n"
                  "void main(){ gl_FragColor = vec4(vCol.rgb, vCol.a * texture2D(uTex, vUv).a); }\n";
              GLuint v = Compile(GL_VERTEX_SHADER, vs);
              GLuint f = Compile(GL_FRAGMENT_SHADER, fs);
              if (!v || !f) return EFalse;
              gProg = glCreateProgram();
              glAttachShader(gProg, v);
              glAttachShader(gProg, f);
              glBindAttribLocation(gProg, 0, "aPos");
              glBindAttribLocation(gProg, 1, "aUv");
              glBindAttribLocation(gProg, 2, "aCol");
              glLinkProgram(gProg);
              GLint ok = 0;
              glGetProgramiv(gProg, GL_LINK_STATUS, &ok);
              glDeleteShader(v);
              glDeleteShader(f);
              if (!ok)
                  {
                  sym_log("[OVL] program link failed");
                  glDeleteProgram(gProg);
                  gProg = 0;
                  return EFalse;
                  }
              gLocScr = glGetUniformLocation(gProg, "uScr");
              gLocTex = glGetUniformLocation(gProg, "uTex");

              static TUint8 px[KTexW * KTexH];
              for (int y = 0; y < 72; ++y)
                  for (int x = 0; x < 128; ++x)
                      px[y * KTexW + x] = (kFontBits[y * 16 + (x >> 3)] & (0x80 >> (x & 7))) ? 255 : 0;
              for (int y = 72; y < KTexH; ++y)
                  for (int x = 0; x < KTexW; ++x) px[y * KTexW + x] = 255;
              GLint prevTex = 0, prevAlign = 4;
              glGetIntegerv(GL_TEXTURE_BINDING_2D, &prevTex);
              glGetIntegerv(GL_UNPACK_ALIGNMENT, &prevAlign);
              glGenTextures(1, &gTex);
              glBindTexture(GL_TEXTURE_2D, gTex);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_ALPHA, KTexW, KTexH, 0, GL_ALPHA, GL_UNSIGNED_BYTE, px);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
              glPixelStorei(GL_UNPACK_ALIGNMENT, prevAlign);
              glBindTexture(GL_TEXTURE_2D, (GLuint)prevTex);
              gSolidU = 4.0f / KTexW;
              gSolidV = 74.0f / KTexH;
              return ETrue;
              }

          void Ovl::Release()
              {
              if (gTex) { glDeleteTextures(1, &gTex); gTex = 0; }
              if (gProg) { glDeleteProgram(gProg); gProg = 0; }
              }

          void Ovl::Begin(TInt aW, TInt aH)
              {
              if (!gProg) return;
              gW = aW;
              gH = aH;
              gN = 0;
              glGetIntegerv(GL_CURRENT_PROGRAM, &sProg);
              glGetIntegerv(GL_ARRAY_BUFFER_BINDING, &sArr);
              glGetIntegerv(GL_ELEMENT_ARRAY_BUFFER_BINDING, &sElem);
              glGetIntegerv(GL_ACTIVE_TEXTURE, &sActive);
              glActiveTexture(GL_TEXTURE0);
              glGetIntegerv(GL_TEXTURE_BINDING_2D, &sTex0);
              glGetIntegerv(GL_VIEWPORT, sVp);
              glGetIntegerv(GL_BLEND_SRC_RGB, &sBlendSrcC);
              glGetIntegerv(GL_BLEND_DST_RGB, &sBlendDstC);
              glGetIntegerv(GL_BLEND_SRC_ALPHA, &sBlendSrcA);
              glGetIntegerv(GL_BLEND_DST_ALPHA, &sBlendDstA);
              glGetIntegerv(GL_BLEND_EQUATION_RGB, &sBlendEqC);
              glGetIntegerv(GL_BLEND_EQUATION_ALPHA, &sBlendEqA);
              sBlend = glIsEnabled(GL_BLEND);
              sDepth = glIsEnabled(GL_DEPTH_TEST);
              sCull = glIsEnabled(GL_CULL_FACE);
              sScissor = glIsEnabled(GL_SCISSOR_TEST);
              glGetBooleanv(GL_DEPTH_WRITEMASK, &sDMask);
              glGetBooleanv(GL_COLOR_WRITEMASK, sCMask);
              for (int i = 0; i < 8; ++i) glGetVertexAttribiv(i, GL_VERTEX_ATTRIB_ARRAY_ENABLED, &sAttrEn[i]);

              glBindBuffer(GL_ARRAY_BUFFER, 0);
              glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, 0);
              glViewport(0, 0, aW, aH);
              glDisable(GL_DEPTH_TEST);
              glDisable(GL_CULL_FACE);
              glDisable(GL_SCISSOR_TEST);
              glDepthMask(GL_FALSE);
              glColorMask(GL_TRUE, GL_TRUE, GL_TRUE, GL_TRUE);
              glEnable(GL_BLEND);
              glBlendEquation(GL_FUNC_ADD);
              glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
              for (int i = 0; i < 8; ++i)
                  {
                  if (i < 3) glEnableVertexAttribArray(i);
                  else glDisableVertexAttribArray(i);
                  }
              glUseProgram(gProg);
              glUniform2f(gLocScr, (GLfloat)aW, (GLfloat)aH);
              glUniform1i(gLocTex, 0);
              glBindTexture(GL_TEXTURE_2D, gTex);
              }

          void Ovl::End()
              {
              if (!gProg) return;
              Flush();
              glUseProgram((GLuint)sProg);
              glBindTexture(GL_TEXTURE_2D, (GLuint)sTex0);
              glActiveTexture((GLenum)sActive);
              glBindBuffer(GL_ARRAY_BUFFER, (GLuint)sArr);
              glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, (GLuint)sElem);
              glViewport(sVp[0], sVp[1], sVp[2], sVp[3]);
              glBlendEquationSeparate((GLenum)sBlendEqC, (GLenum)sBlendEqA);
              glBlendFuncSeparate((GLenum)sBlendSrcC, (GLenum)sBlendDstC, (GLenum)sBlendSrcA, (GLenum)sBlendDstA);
              if (sBlend) glEnable(GL_BLEND); else glDisable(GL_BLEND);
              if (sDepth) glEnable(GL_DEPTH_TEST); else glDisable(GL_DEPTH_TEST);
              if (sCull) glEnable(GL_CULL_FACE); else glDisable(GL_CULL_FACE);
              if (sScissor) glEnable(GL_SCISSOR_TEST); else glDisable(GL_SCISSOR_TEST);
              glDepthMask(sDMask);
              glColorMask(sCMask[0], sCMask[1], sCMask[2], sCMask[3]);
              for (int i = 0; i < 8; ++i)
                  {
                  if (sAttrEn[i]) glEnableVertexAttribArray(i);
                  else glDisableVertexAttribArray(i);
                  }
              }

          void Ovl::Quad(TReal32 x0, TReal32 y0, TReal32 x1, TReal32 y1, TUint32 c)
              {
              if (!gProg) return;
              float u = gSolidU, v = gSolidV;
              Tri(x0, y0, u, v, x1, y0, u, v, x1, y1, u, v, c);
              Tri(x0, y0, u, v, x1, y1, u, v, x0, y1, u, v, c);
              }

          void Ovl::Circle(TReal32 cx, TReal32 cy, TReal32 r, TUint32 c)
              {
              if (!gProg) return;
              // 16-gon, precomputed unit circle
              static const float ct[17] = { 1.0f, 0.92388f, 0.70711f, 0.38268f, 0.0f, -0.38268f, -0.70711f, -0.92388f, -1.0f,
                                            -0.92388f, -0.70711f, -0.38268f, 0.0f, 0.38268f, 0.70711f, 0.92388f, 1.0f };
              float u = gSolidU, v = gSolidV;
              for (int i = 0; i < 16; ++i)
                  {
                  int j = i + 1;
                  float ci = ct[i], si = ct[(i + 12) & 15];
                  float cj = ct[j], sj = ct[(j + 12) & 15];
                  Tri(cx, cy, u, v, cx + ci * r, cy + si * r, u, v, cx + cj * r, cy + sj * r, u, v, c);
                  }
              }

          TReal32 Ovl::TextWidth(const char* s, TReal32 sc)
              {
              TInt n = 0;
              while (*s++) ++n;
              return n * 8 * sc;
              }

          void Ovl::Text(TReal32 x, TReal32 y, TReal32 sc, const char* s, TUint32 c)
              {
              if (!gProg) return;
              for (; *s; ++s)
                  {
                  int ch = (unsigned char)*s;
                  if (ch < 32 || ch > 127) ch = '?';
                  if (ch != 32)
                      {
                      int idx = ch - 32;
                      float u0 = (float)((idx & 15) * 8) / KTexW, v0 = (float)((idx >> 4) * 12) / KTexH;
                      float u1 = u0 + 8.0f / KTexW, v1 = v0 + 12.0f / KTexH;
                      float x1 = x + 8 * sc, y1 = y + 12 * sc;
                      Tri(x, y, u0, v0, x1, y, u1, v0, x1, y1, u1, v1, c);
                      Tri(x, y, u0, v0, x1, y1, u1, v1, x, y1, u0, v1, c);
                      }
                  x += 8 * sc;
                  }
              }
          EOF_SM64
          mkdir -p "$(dirname symbian/app/src/sm64_view.cpp)"
          cat > symbian/app/src/sm64_view.cpp <<'EOF_SM64'
          // Main control: loading/error screens, frame loop, multi-touch N64 pad (GL overlay), menu.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <w32std.h>
          #include <GLES2/gl2.h>
          #include <bautils.h>
          #include <e32math.h>
          #include "sm64app.h"

          static const TInt64 KStepUs = 33333;   // SM64 logic runs at 30 Hz
          static const TInt KTimerUs = 8000;

          _LIT(KLoading1, "Starting Super Mario 64...");
          _LIT(KErrTitle, "Super Mario 64 could not start");

          // ---------------------------------------------------------------------------
          // GL window
          // ---------------------------------------------------------------------------
          CSm64GlView* CSm64GlView::NewL(const TRect& aRect)
              {
              CSm64GlView* self = new (ELeave) CSm64GlView;
              self->iChild = NULL;
              CleanupStack::PushL(self);
              self->CreateWindowL();
              self->SetExtentToWholeScreen();
              self->Window().SetBackgroundColor(KRgbBlack);   // black comes from the window, never from Draw()
              self->SetRect(aRect);
              self->ActivateL();
              CleanupStack::Pop(self);
              return self;
              }

          void CSm64GlView::Draw(const TRect& /*aRect*/) const {}

          // ---------------------------------------------------------------------------
          // exception logging
          // ---------------------------------------------------------------------------
          static void Sm64ExcHandler(TExcType aType)
              {
              sym_log("[EXC] exception type=%d", (int)aType);
              RHeap& h = User::Heap();
              TInt biggest = 0;
              TInt avail = h.Available(biggest);
              sym_log("[HEAP] size=%d max=%d free=%d biggest=%d", (int)h.Size(), (int)h.MaxLength(), (int)avail, (int)biggest);
              User::Panic(_L("Sm64Exc"), (TInt)aType);
              }

          // ---------------------------------------------------------------------------
          // container
          // ---------------------------------------------------------------------------
          CSm64Container* CSm64Container::NewL(const TRect& aRect, CSm64GlView* aView)
              {
              CSm64Container* self = new (ELeave) CSm64Container;
              CleanupStack::PushL(self);
              self->ConstructL(aRect, aView);
              CleanupStack::Pop(self);
              return self;
              }

          CSm64Container::CSm64Container() {}

          CSm64Container::~CSm64Container()
              {
              StopTimer();
              sym_input.buttons = 0;
              sym_input.stick_x = 0;
              sym_input.stick_y = 0;
              delete iTimer;
              delete iIdle;
              delete iAudio;
              iAudio = NULL;
              Sym_SetOverlay(NULL, NULL);
              if (iStarted) Sym_Shutdown();
              if (iGlUp)
                  {
                  Ovl::Release();
                  Sym_GlShutdown();
                  }
              iFs.Close();
              }

          static void OverlayThunk(void* aCtx, int aW, int aH)
              {
              static_cast<CSm64Container*>(aCtx)->DrawOverlay(aW, aH);
              }

          void CSm64Container::ConstructL(const TRect& aRect, CSm64GlView* aView)
              {
              iView = aView;
              SetContainerWindowL(*aView);
              EnableDragEvents();
          #ifdef Z3_MULTITOUCH
              Window().EnableAdvancedPointers();
          #endif
              SetFocusing(ETrue);
              User::LeaveIfError(iFs.Connect());

              iMode = ELoading;
              iForeground = ETrue;
              iStickPtr = -1;
              iMenuSel = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i) iPtrDown[i] = EFalse;

              SetRect(aRect);
              ActivateL();

              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              iIdle = CIdle::NewL(CActive::EPriorityIdle);
              iIdle->Start(TCallBack(InitCb, this));   // lets the loading screen appear first
              }

          TInt CSm64Container::InitCb(TAny* aPtr)
              {
              static_cast<CSm64Container*>(aPtr)->DoInit();
              return 0;
              }

          void CSm64Container::SetError(const TDesC8& aText)
              {
              iErrLine1.Zero();
              iErrLine2.Zero();
              TInt len = aText.Length();
              const TInt split = 56;
              if (len <= split) iErrLine1.Copy(aText);
              else
                  {
                  TInt cut = split;
                  while (cut > 20 && aText[cut] != 32) --cut;
                  iErrLine1.Copy(aText.Left(cut));
                  iErrLine2.Copy(aText.Mid(cut).Left(iErrLine2.MaxLength()));
                  }
              ReleaseAll();
              iMode = EError;
              sym_log("[ERR] %S", &aText);
              }

          // First drive that already has \sm64 (E: mass memory, F: card first), else create it on the first writable one.
          TBool CSm64Container::FindUserDir(TDes8& aPath)
              {
              TDriveList list;
              if (iFs.DriveList(list) != KErrNone) return EFalse;
              const TInt order[8] = { 4, 5, 2, 6, 7, 3, 8, 9 };
              for (TInt pass = 0; pass < 2; ++pass)
                  {
                  for (TInt k = 0; k < 8; ++k)
                      {
                      TInt d = order[k];
                      if (d >= KMaxDrives || !list[d]) continue;
                      TFileName dir;
                      dir.Append((TChar)('A' + d));
                      dir.Append(_L(":\\sm64\\"));
                      TBool ok = EFalse;
                      if (pass == 0) ok = BaflUtils::FolderExists(iFs, dir);
                      else ok = (iFs.MkDirAll(dir) == KErrNone || BaflUtils::FolderExists(iFs, dir));
                      if (ok)
                          {
                          aPath.Zero();
                          aPath.Append((TChar)('A' + d));
                          aPath.Append(_L8(":/sm64"));
                          return ETrue;
                          }
                      }
                  }
              return EFalse;
              }

          void CSm64Container::GlStatusScreen(const char* aL1, const char* aL2)
              {
              if (!iGlUp) return;
              Ovl::Begin(iGlW, iGlH);
              glClearColor(0.f, 0.f, 0.f, 1.f);
              glClear(GL_COLOR_BUFFER_BIT);
              TReal32 sc = iGlH >= 300 ? 2.0f : 1.0f;
              TReal32 y = iGlH / 2 - 30 * sc;
              if (aL1) Ovl::Text((iGlW - Ovl::TextWidth(aL1, sc)) / 2, y, sc, aL1, OVL_RGBA(255, 255, 255, 255));
              if (aL2) Ovl::Text((iGlW - Ovl::TextWidth(aL2, sc)) / 2, y + 20 * sc, sc, aL2, OVL_RGBA(200, 200, 255, 255));
              Ovl::End();
              Sym_GlSwap();
              }

          void CSm64Container::DoInit()
              {
              User::SetExceptionHandler(Sm64ExcHandler, KExceptionFault | KExceptionInteger | KExceptionFpe);

              TBuf8<64> path;
              if (!FindUserDir(path))
                  {
                  SetError(_L8("No writable drive found (need <drive>:\\sm64\\)"));
                  DrawNow();
                  return;
                  }
              path.ZeroTerminate();
              sym_set_dir((const char*)path.Ptr());

              const char* glErr = Sym_GlInit(&iView->GlWindow());
              if (glErr)
                  {
                  TPtrC8 msg((const TUint8*)glErr);
                  SetError(msg);
                  DrawNow();
                  return;
                  }
              iGlUp = ETrue;
              Sym_GlSize(&iGlW, &iGlH);
              TInt cw = Rect().Width(), ch = Rect().Height();
              sym_log("[UI] window %dx%d, gl %dx%d", (int)cw, (int)ch, (int)iGlW, (int)iGlH);
              if (!Ovl::Init()) sym_log("[UI] overlay init failed (no touch pad)");
              ComputeLayout(iGlW, iGlH);
              Sym_SetOverlay(OverlayThunk, this);

              GlStatusScreen("LOADING", "first start can take a while");
              iStarted = ETrue;   // Sym_Shutdown is safe even after a failed start
              if (Sym_Start() != 0)
                  {
                  const char* e = Sym_Error();
                  TPtrC8 msg((const TUint8*)(e ? e : "start failed"));
                  SetError(msg);
                  return;
                  }
              TRAPD(aerr, iAudio = CSm64Audio::NewL());
              if (aerr != KErrNone) iAudio = NULL;

              iMode = EPlay;
              iNextDue = sym_time_us();
              iSkipRun = 0;
              StartTimer();
              }

          void CSm64Container::StartTimer()
              {
              if (iTimer && !iTimer->IsActive())
                  {
                  iNextDue = sym_time_us();
                  iTimer->Start(KTimerUs, KTimerUs, TCallBack(TickCb, this));
                  }
              }

          void CSm64Container::StopTimer()
              {
              if (iTimer) iTimer->Cancel();
              }

          void CSm64Container::SetForeground(TBool aForeground)
              {
              iForeground = aForeground;
              if (!aForeground)
                  {
                  ReleaseAll();
                  if (iAudio) iAudio->Suspend();
                  StopTimer();
                  if (iMode == EPlay) iMode = EMenu, iMenuSel = 0;   // come back to the menu, not mid-jump
                  }
              else
                  {
                  if (iAudio) iAudio->Resume();
                  if (iMode == EPlay || iMode == EMenu || iMode == EError) StartTimer();
                  }
              }

          TInt CSm64Container::TickCb(TAny* aPtr)
              {
              static_cast<CSm64Container*>(aPtr)->Tick();
              return 0;
              }

          void CSm64Container::Quit()
              {
              StopTimer();
              TRAPD(err, iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit));
              (void)err;
              }

          void CSm64Container::Tick()
              {
              if (!iForeground) return;
              if (iMode == EError)
                  {
                  if (iGlUp)
                      {
                      TBuf8<160> a(iErrLine1), b(iErrLine2);
                      a.ZeroTerminate();
                      b.ZeroTerminate();
                      GlStatusScreen((const char*)a.Ptr(), (const char*)b.Ptr());
                      }
                  return;
                  }
              if (iMode == EMenu)
                  {
                  MenuFrame();
                  return;
                  }
              if (iMode != EPlay) return;

              TInt64 now = sym_time_us();
              TInt steps = 0;
              while (now >= iNextDue && steps < 3)
                  {
                  TBool last = (now < iNextDue + KStepUs) || steps == 2;
                  TBool render = last || !sym_cfg.frameskip || iSkipRun >= 2;
                  iSkipRun = render ? 0 : iSkipRun + 1;
                  iNextDue += KStepUs;
                  ++steps;
                  TInt r = Sym_Frame(render ? 1 : 0);
                  if (r < 0)
                      {
                      const char* e = Sym_Error();
                      TPtrC8 msg((const TUint8*)(e ? e : "fatal error"));
                      SetError(msg);
                      return;
                      }
                  if (r == 1)
                      {
                      Quit();
                      return;
                      }
                  now = sym_time_us();
                  }
              if (now - iNextDue > 250000) iNextDue = now;   // far behind: resync instead of fast-forwarding
              }

          // ---------------------------------------------------------------------------
          // Layout
          // ---------------------------------------------------------------------------
          static TSm64Btn MkCircle(TInt cx, TInt cy, TInt r, TUint mask, const char* label)
              {
              TSm64Btn b;
              b.iCircle = 1;
              b.iCx = cx; b.iCy = cy; b.iR = r;
              b.iRect = TRect(cx - r, cy - r, cx + r, cy + r);
              b.iMask = mask;
              b.iLabel = label;
              return b;
              }

          static TSm64Btn MkRect(TInt x0, TInt y0, TInt x1, TInt y1, TUint mask, const char* label)
              {
              TSm64Btn b;
              b.iCircle = 0;
              b.iCx = (x0 + x1) / 2; b.iCy = (y0 + y1) / 2; b.iR = 0;
              b.iRect = TRect(x0, y0, x1, y1);
              b.iMask = mask;
              b.iLabel = label;
              return b;
              }

          void CSm64Container::SizeChanged()
              {
              if (iGlUp)
                  {
                  Sym_GlSize(&iGlW, &iGlH);
                  ComputeLayout(iGlW, iGlH);
                  }
              }

          void CSm64Container::ComputeLayout(TInt w, TInt h)
              {
              iLayW = w;
              iLayH = h;
              TReal32 s = (TReal32)sym_cfg.scale / 100.0f;
              TReal32 base = (TReal32)Min(h / 5, w / 8);
              TReal32 U = base * s;
              iUnit = U;
              const TBool mir = sym_cfg.mirror;
          #define MX(x) (mir ? (w - (x)) : (x))
              TInt k = 0;
              // A / B (bottom-right)
              iBtn[k++] = MkCircle(MX(w - (TInt)(1.5f * U)), h - (TInt)(1.6f * U), (TInt)(0.85f * U), SYM_BTN_A, "A");
              iBtn[k++] = MkCircle(MX(w - (TInt)(3.2f * U)), h - (TInt)(1.0f * U), (TInt)(0.75f * U), SYM_BTN_B, "B");
              // C cluster
              TInt ccx = w - (TInt)(1.8f * U), ccy = h - (TInt)(4.3f * U);
              TInt co = (TInt)(0.85f * U), cr = (TInt)(0.5f * U);
              iBtn[k++] = MkCircle(MX(ccx), ccy - co, cr, SYM_BTN_CU, "^");
              iBtn[k++] = MkCircle(MX(ccx), ccy + co, cr, SYM_BTN_CD, "v");
              iBtn[k++] = MkCircle(MX(ccx - co), ccy, cr, SYM_BTN_CL, "<");
              iBtn[k++] = MkCircle(MX(ccx + co), ccy, cr, SYM_BTN_CR, ">");
              // Z / L / R
              TInt bw = (TInt)(2.0f * U), bh = (TInt)(0.95f * U), m = (TInt)(0.2f * U);
              if (!mir)
                  {
                  iBtn[k++] = MkRect(m, m + bh + m, m + bw, m + bh + m + bh, SYM_BTN_Z, "Z");
                  iBtn[k++] = MkRect(m, m, m + bw, m + bh, SYM_BTN_L, "L");
                  iBtn[k++] = MkRect(w - m - bw, m, w - m, m + bh, SYM_BTN_R, "R");
                  }
              else
                  {
                  iBtn[k++] = MkRect(w - m - bw, m + bh + m, w - m, m + bh + m + bh, SYM_BTN_Z, "Z");
                  iBtn[k++] = MkRect(w - m - bw, m, w - m, m + bh, SYM_BTN_L, "L");
                  iBtn[k++] = MkRect(m, m, m + bw, m + bh, SYM_BTN_R, "R");
                  }
              // START / MENU (centred)
              TInt sw = (TInt)(1.1f * U);
              iBtn[k++] = MkRect(w / 2 - sw, h - m - bh, w / 2 + sw, h - m, SYM_BTN_START, "START");
              iBtn[k++] = MkRect(w / 2 - sw, m, w / 2 + sw, m + bh, KMenuMask, "MENU");
          #undef MX
              iStickR = (TInt)(1.7f * U);
              iStickFixed = TPoint(mir ? w - (TInt)(2.4f * U) : (TInt)(2.4f * U), h - (TInt)(2.3f * U));
              }

          TBool CSm64Container::OnButton(const TSm64Btn& b, const TPoint& p) const
              {
              if (b.iCircle)
                  {
                  TInt dx = p.iX - b.iCx, dy = p.iY - b.iCy;
                  TInt r = b.iR + b.iR / 4;    // forgiving hit area
                  return dx * dx + dy * dy <= r * r;
                  }
              TRect r = b.iRect;
              r.Grow(b.iRect.Height() / 8, b.iRect.Height() / 8);
              return r.Contains(p);
              }

          // ---------------------------------------------------------------------------
          // Overlay drawing (called from gfx_symbian swap_buffers_end, inside the GL frame)
          // ---------------------------------------------------------------------------
          void CSm64Container::DrawOverlay(TInt aW, TInt aH)
              {
              if (!iGlUp) return;
              if (aW != iLayW || aH != iLayH) ComputeLayout(aW, aH);
              Ovl::Begin(aW, aH);
              if (sym_cfg.show_pad && iMode == EPlay) 
                  {
                  const TUint a = (TUint)(sym_cfg.opacity * 255 / 100);
                  const TUint down = iTouchBits | iKeyBits;
                  const TUint line = OVL_RGBA(255, 255, 255, a);
                  const TUint fillUp = OVL_RGBA(255, 255, 255, a / 5);
                  const TUint fillDn = OVL_RGBA(255, 255, 255, a * 2 / 3);
                  // stick
                  TPoint c = iStickPtr >= 0 ? iStickO : iStickFixed;
                  if (sym_cfg.float_stick && iStickPtr < 0)
                      {
                      // idle floating stick: faint hint at the default spot
                      Ovl::Circle((TReal32)c.iX, (TReal32)c.iY, (TReal32)iStickR, OVL_RGBA(255, 255, 255, a / 8));
                      }
                  else
                      {
                      Ovl::Circle((TReal32)c.iX, (TReal32)c.iY, (TReal32)iStickR, OVL_RGBA(255, 255, 255, a / 5));
                      Ovl::Circle((TReal32)c.iX, (TReal32)c.iY, (TReal32)iStickR - 3, OVL_RGBA(0, 0, 0, a / 3));
                      }
                  TPoint k = iStickPtr >= 0 ? iStickCur : c;
                  if (iKeyDirs)
                      {
                      TInt dx = (iKeyDirs & 8 ? 1 : 0) - (iKeyDirs & 4 ? 1 : 0);
                      TInt dy = (iKeyDirs & 2 ? 1 : 0) - (iKeyDirs & 1 ? 1 : 0);
                      k = TPoint(c.iX + dx * iStickR / 2, c.iY + dy * iStickR / 2);
                      }
                  Ovl::Circle((TReal32)k.iX, (TReal32)k.iY, (TReal32)iStickR * 0.45f, fillDn);
                  // buttons
                  for (TInt i = 0; i < KBtns; ++i)
                      {
                      const TSm64Btn& b = iBtn[i];
                      TBool on = (b.iMask != KMenuMask) && (down & b.iMask);
                      TUint fill = on ? fillDn : fillUp;
                      if (b.iCircle)
                          {
                          Ovl::Circle((TReal32)b.iCx, (TReal32)b.iCy, (TReal32)b.iR, line);
                          Ovl::Circle((TReal32)b.iCx, (TReal32)b.iCy, (TReal32)b.iR - 2, on ? fill : OVL_RGBA(0, 0, 0, a / 2));
                          if (on) Ovl::Circle((TReal32)b.iCx, (TReal32)b.iCy, (TReal32)b.iR - 2, fill);
                          }
                      else
                          {
                          Ovl::Quad((TReal32)b.iRect.iTl.iX, (TReal32)b.iRect.iTl.iY, (TReal32)b.iRect.iBr.iX, (TReal32)b.iRect.iBr.iY, line);
                          Ovl::Quad((TReal32)b.iRect.iTl.iX + 2, (TReal32)b.iRect.iTl.iY + 2, (TReal32)b.iRect.iBr.iX - 2, (TReal32)b.iRect.iBr.iY - 2,
                                    on ? fill : OVL_RGBA(0, 0, 0, a / 2));
                          }
                      TReal32 ts = iUnit >= 48 ? 2.0f : 1.0f;
                      TReal32 tw = Ovl::TextWidth(b.iLabel, ts);
                      Ovl::Text(b.iCx - tw / 2, b.iCy - 6 * ts, ts, b.iLabel, line);
                      }
                  }
              if (sym_cfg.show_fps)
                  {
                  int lf = 0, rf = 0;
                  Sym_Fps(&lf, &rf);
                  char buf[32];
                  buf[0] = 0;
                  // no sprintf float: tiny int formatting
                  char* p = buf;
                  const int vals[2] = { lf, rf };
                  for (int v = 0; v < 2; ++v)
                      {
                      int n = vals[v];
                      char t[8]; int tl = 0;
                      if (n == 0) t[tl++] = '0';
                      while (n > 0 && tl < 7) { t[tl++] = (char)('0' + n % 10); n /= 10; }
                      while (tl > 0) *p++ = t[--tl];
                      *p++ = v == 0 ? '/' : 0;
                      }
                  Ovl::Text(aW / 2 + 70.f, 4.f, 1.0f, buf, OVL_RGBA(255, 255, 0, 255));
                  }
              Ovl::End();
              }

          // ---------------------------------------------------------------------------
          // Menu
          // ---------------------------------------------------------------------------
          void CSm64Container::OpenMenu()
              {
              ReleaseAll();
              iMode = EMenu;
              iMenuSel = 0;
              }

          void CSm64Container::CloseMenu()
              {
              sym_settings_save();
              iMode = EPlay;
              iNextDue = sym_time_us();
              }

          void CSm64Container::MenuLabel(TInt i, TBuf8<48>& o) const
              {
              o.Zero();
              switch (i)
                  {
                  case 0: o.Append(_L8("Resume")); break;
                  case 1: o.Append(sym_cfg.sound ? _L8("Sound: on") : _L8("Sound: off")); break;
                  case 2: o.Append(sym_cfg.show_pad ? _L8("Touch pad: on") : _L8("Touch pad: off")); break;
                  case 3: o.Append(sym_cfg.float_stick ? _L8("Stick: floating") : _L8("Stick: fixed")); break;
                  case 4: o.Append(sym_cfg.mirror ? _L8("Layout: mirrored") : _L8("Layout: normal")); break;
                  case 5: o.Append(_L8("Opacity: ")); o.AppendNum(sym_cfg.opacity); o.Append(_L8("%")); break;
                  case 6: o.Append(_L8("Pad size: ")); o.AppendNum(sym_cfg.scale); o.Append(_L8("%")); break;
                  case 7: o.Append(sym_cfg.frameskip ? _L8("Frameskip: auto") : _L8("Frameskip: off")); break;
                  case 8: o.Append(sym_cfg.show_fps ? _L8("FPS counter: on") : _L8("FPS counter: off")); break;
                  default: o.Append(_L8("Exit")); break;
                  }
              }

          void CSm64Container::MenuAction(TInt a)
              {
              switch (a)
                  {
                  case 0: CloseMenu(); return;
                  case 1: sym_cfg.sound = !sym_cfg.sound; Sym_SetSound(sym_cfg.sound); break;
                  case 2: sym_cfg.show_pad = !sym_cfg.show_pad; break;
                  case 3: sym_cfg.float_stick = !sym_cfg.float_stick; break;
                  case 4: sym_cfg.mirror = !sym_cfg.mirror; ComputeLayout(iLayW, iLayH); break;
                  case 5: sym_cfg.opacity += 15; if (sym_cfg.opacity > 100) sym_cfg.opacity = 25; break;
                  case 6: sym_cfg.scale += 10; if (sym_cfg.scale > 140) sym_cfg.scale = 70; ComputeLayout(iLayW, iLayH); break;
                  case 7: sym_cfg.frameskip = !sym_cfg.frameskip; break;
                  case 8: sym_cfg.show_fps = !sym_cfg.show_fps; break;
                  default:
                      sym_settings_save();
                      Quit();
                      return;
                  }
              }

          void CSm64Container::MenuGeom(TInt& x, TInt& y, TInt& w, TInt& row, TInt& sc) const
              {
              row = iGlH / (KMenuItems + 1);
              sc = row >= 30 ? 2 : 1;
              w = Min(iGlW - 20, 17 * 8 * sc + 32);
              x = (iGlW - w) / 2;
              y = (iGlH - row * KMenuItems) / 2;
              }

          TInt CSm64Container::MenuRowAt(const TPoint& p) const
              {
              TInt x, y, w, row, sc;
              MenuGeom(x, y, w, row, sc);
              if (p.iX < x || p.iX >= x + w || p.iY < y || p.iY >= y + row * KMenuItems) return -1;
              return (p.iY - y) / row;
              }

          void CSm64Container::MenuFrame()
              {
              if (!iGlUp) return;
              TInt x, y, w, row, sc;
              MenuGeom(x, y, w, row, sc);
              Ovl::Begin(iGlW, iGlH);
              glClearColor(0.04f, 0.04f, 0.10f, 1.f);
              glClear(GL_COLOR_BUFFER_BIT);
              Ovl::Quad((TReal32)x - 4, (TReal32)y - 4, (TReal32)(x + w) + 4, (TReal32)(y + row * KMenuItems) + 4, OVL_RGBA(255, 255, 255, 200));
              Ovl::Quad((TReal32)x - 2, (TReal32)y - 2, (TReal32)(x + w) + 2, (TReal32)(y + row * KMenuItems) + 2, OVL_RGBA(10, 10, 30, 255));
              for (TInt i = 0; i < KMenuItems; ++i)
                  {
                  TInt ry = y + i * row;
                  if (i == iMenuSel) Ovl::Quad((TReal32)x, (TReal32)ry, (TReal32)(x + w), (TReal32)(ry + row), OVL_RGBA(70, 70, 150, 255));
                  TBuf8<48> lbl;
                  MenuLabel(i, lbl);
                  lbl.ZeroTerminate();
                  const char* s = (const char*)lbl.Ptr();
                  TReal32 tw = Ovl::TextWidth(s, (TReal32)sc);
                  Ovl::Text(x + (w - tw) / 2, ry + (row - 12 * sc) / 2.0f, (TReal32)sc, s, OVL_RGBA(255, 255, 255, 255));
                  }
              Ovl::End();
              Sym_GlSwap();
              }

          // ---------------------------------------------------------------------------
          // Input
          // ---------------------------------------------------------------------------
          void CSm64Container::PushInput()
              {
              TInt sx = iTouchSx, sy = iTouchSy;
              if (iKeyDirs)
                  {
                  TInt kx = (iKeyDirs & 8 ? 80 : 0) - (iKeyDirs & 4 ? 80 : 0);
                  TInt ky = (iKeyDirs & 1 ? 80 : 0) - (iKeyDirs & 2 ? 80 : 0);
                  if (kx) sx = kx;
                  if (ky) sy = ky;
                  }
              sym_input.buttons = (uint16_t)(iTouchBits | iKeyBits);
              sym_input.stick_x = (int8_t)sx;
              sym_input.stick_y = (int8_t)sy;
              }

          void CSm64Container::ReleaseAll()
              {
              iTouchBits = 0;
              iKeyBits = 0;
              iKeyDirs = 0;
              iTouchSx = iTouchSy = 0;
              iStickPtr = -1;
              for (TInt i = 0; i < KMaxPtrs; ++i) iPtrDown[i] = EFalse;
              PushInput();
              }

          void CSm64Container::UpdateTouch()
              {
              TUint bits = 0;
              TInt sx = 0, sy = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i)
                  {
                  if (!iPtrDown[i]) continue;
                  if (i == iStickPtr)
                      {
                      TInt dx = iPtrPos[i].iX - iStickO.iX;
                      TInt dy = iPtrPos[i].iY - iStickO.iY;
                      TInt r = iStickR;
                      // clamp the knob to the ring, floating stick follows the finger past the edge
                      TInt d2 = dx * dx + dy * dy;
                      if (d2 > r * r)
                          {
                          TReal d;
                          Math::Sqrt(d, (TReal)d2);
                          TReal f = (TReal)r / d;
                          TInt cx = (TInt)(dx * f), cy = (TInt)(dy * f);
                          if (sym_cfg.float_stick)
                              {
                              iStickO.iX += dx - cx;
                              iStickO.iY += dy - cy;
                              }
                          dx = cx;
                          dy = cy;
                          }
                      iStickCur = TPoint(iStickO.iX + dx, iStickO.iY + dy);
                      TInt dead = r / 6;
                      if (dx * dx + dy * dy > dead * dead)
                          {
                          sx = dx * 80 / r;
                          sy = -dy * 80 / r;
                          }
                      continue;
                      }
                  for (TInt b = 0; b < KBtns; ++b)
                      if (iBtn[b].iMask != KMenuMask && OnButton(iBtn[b], iPtrPos[i])) bits |= iBtn[b].iMask;
                  }
              iTouchBits = bits;
              iTouchSx = sx;
              iTouchSy = sy;
              PushInput();
              }

          void CSm64Container::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              TPoint pt = aEvent.iPosition;
              TInt id = 0;
          #ifdef Z3_MULTITOUCH
              const TAdvancedPointerEvent* adv = aEvent.AdvancedPointerEvent();
              if (adv) id = adv->PointerNumber();
          #endif
              if (id < 0 || id >= KMaxPtrs) return;
              // window -> GL pixel space (identical on all known devices, scaled if not)
              TInt cw = Rect().Width(), ch = Rect().Height();
              if (iGlUp && cw > 0 && ch > 0 && (cw != iGlW || ch != iGlH))
                  pt = TPoint(pt.iX * iGlW / cw, pt.iY * iGlH / ch);

              if (iMode == EPlay)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Down)
                      {
                      for (TInt b = 0; b < KBtns; ++b)
                          if (iBtn[b].iMask == KMenuMask && OnButton(iBtn[b], pt))
                              {
                              OpenMenu();
                              return;
                              }
                      iPtrDown[id] = ETrue;
                      iPtrPos[id] = pt;
                      if (iStickPtr < 0)
                          {
                          TBool onBtn = EFalse;
                          for (TInt b = 0; b < KBtns; ++b)
                              if (OnButton(iBtn[b], pt)) { onBtn = ETrue; break; }
                          if (!onBtn)
                              {
                              TBool leftSide = sym_cfg.mirror ? (pt.iX >= iGlW / 2) : (pt.iX < iGlW / 2);
                              TInt fx = pt.iX - iStickFixed.iX, fy = pt.iY - iStickFixed.iY;
                              TInt lim = iStickR * 3 / 2;
                              if (sym_cfg.float_stick ? leftSide : (fx * fx + fy * fy <= lim * lim))
                                  {
                                  iStickPtr = id;
                                  iStickO = sym_cfg.float_stick ? pt : iStickFixed;
                                  iStickCur = pt;
                                  }
                              }
                          }
                      }
                  else if (aEvent.iType == TPointerEvent::EDrag)
                      {
                      iPtrDown[id] = ETrue;
                      iPtrPos[id] = pt;
                      }
                  else if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      iPtrDown[id] = EFalse;
                      if (iStickPtr == id) iStickPtr = -1;
                      }
                  UpdateTouch();
                  return;
                  }

              if (iMode == EMenu)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Down)
                      {
                      TInt r = MenuRowAt(pt);
                      if (r >= 0) iMenuSel = r;
                      }
                  else if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      TInt r = MenuRowAt(pt);
                      if (r >= 0) MenuAction(r);
                      else CloseMenu();
                      }
                  return;
                  }

              if (iMode == EError && aEvent.iType == TPointerEvent::EButton1Up) Quit();
              }

          TKeyResponse CSm64Container::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              const TInt sc = aKey.iScanCode;

              if (iMode == EPlay)
                  {
                  TUint bit = 0, dir = 0;
                  switch (sc)
                      {
                      case EStdKeyUpArrow:    dir = 1; break;
                      case EStdKeyDownArrow:  dir = 2; break;
                      case EStdKeyLeftArrow:  dir = 4; break;
                      case EStdKeyRightArrow: dir = 8; break;
                      case 'X': case EStdKeySpace: case EStdKeyDevice3: bit = SYM_BTN_A; break;
                      case 'C': case EStdKeyBackspace: bit = SYM_BTN_B; break;
                      case 'Z':               bit = SYM_BTN_Z; break;
                      case EStdKeyEnter:      bit = SYM_BTN_START; break;
                      case 'Q':               bit = SYM_BTN_L; break;
                      case 'W':               bit = SYM_BTN_R; break;
                      case 'T':               bit = SYM_BTN_CU; break;
                      case 'G':               bit = SYM_BTN_CD; break;
                      case 'F':               bit = SYM_BTN_CL; break;
                      case 'H':               bit = SYM_BTN_CR; break;
                      default: break;
                      }
                  if (aType == EEventKeyDown && sc == EStdKeyDevice0)   // left soft key
                      {
                      OpenMenu();
                      return EKeyWasConsumed;
                      }
                  if (bit || dir)
                      {
                      if (aType == EEventKeyDown) { iKeyBits |= bit; iKeyDirs |= dir; }
                      else if (aType == EEventKeyUp) { iKeyBits &= ~bit; iKeyDirs &= ~dir; }
                      PushInput();
                      return EKeyWasConsumed;
                      }
                  return EKeyWasNotConsumed;
                  }

              if (aType != EEventKeyDown)
                  {
                  return (sc == EStdKeyUpArrow || sc == EStdKeyDownArrow || sc == EStdKeyEnter ||
                          sc == EStdKeyDevice3 || sc == EStdKeyDevice0) ? EKeyWasConsumed : EKeyWasNotConsumed;
                  }

              if (iMode == EMenu)
                  {
                  if (sc == EStdKeyUpArrow && iMenuSel > 0) --iMenuSel;
                  else if (sc == EStdKeyDownArrow && iMenuSel < KMenuItems - 1) ++iMenuSel;
                  else if (sc == EStdKeyEnter || sc == EStdKeyDevice3) MenuAction(iMenuSel);
                  else if (sc == EStdKeyDevice0) CloseMenu();
                  else return EKeyWasNotConsumed;
                  return EKeyWasConsumed;
                  }

              if (iMode == EError && (sc == EStdKeyEnter || sc == EStdKeyDevice3 || sc == EStdKeyDevice0))
                  {
                  Quit();
                  return EKeyWasConsumed;
                  }
              return EKeyWasNotConsumed;
              }

          // ---------------------------------------------------------------------------
          // gc drawing before GL is up (loading / early errors)
          // ---------------------------------------------------------------------------
          void CSm64Container::Draw(const TRect& /*aRect*/) const
              {
              if (iGlUp) return;   // the EGL surface owns the pixels
              CWindowGc& gc = SystemGc();
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(TRgb(0, 0, 0, 255));
              gc.Clear(Rect());
              gc.SetPenColor(TRgb(255, 255, 255, 255));
              const CFont* font = iEikonEnv->NormalFont();
              gc.UseFont(font);
              TInt y = Rect().Height() / 2 - 40;
              TBuf<160> t;
              if (iMode == ELoading)
                  {
                  gc.DrawText(KLoading1, TRect(0, y, Rect().Width(), y + 30), font->AscentInPixels() + 4, CGraphicsContext::ECenter, 0);
                  }
              else
                  {
                  gc.DrawText(KErrTitle, TRect(0, y, Rect().Width(), y + 30), font->AscentInPixels() + 4, CGraphicsContext::ECenter, 0);
                  t.Copy(iErrLine1);
                  gc.DrawText(t, TRect(0, y + 34, Rect().Width(), y + 64), font->AscentInPixels() + 4, CGraphicsContext::ECenter, 0);
                  t.Copy(iErrLine2);
                  gc.DrawText(t, TRect(0, y + 60, Rect().Width(), y + 90), font->AscentInPixels() + 4, CGraphicsContext::ECenter, 0);
                  }
              gc.DiscardFont();
              }
          EOF_SM64
          mkdir -p "$(dirname symbian/tools/fakecc.sh)"
          cat > symbian/tools/fakecc.sh <<'EOF_SM64'
          #!/bin/sh
          # Stand-in compiler for the host asset pass: creates the outputs make expects, compiles nothing.
          out=""; mf=""; prev=""
          for a in "$@"; do
            case "$prev" in -o) out="$a";; -MF) mf="$a";; esac
            prev="$a"
          done
          [ -n "$mf" ] && : > "$mf"
          [ -n "$out" ] && { mkdir -p "$(dirname "$out")"; : > "$out"; }
          exit 0
          EOF_SM64
          mkdir -p "$(dirname symbian/tools/prepare_symbian.py)"
          cat > symbian/tools/prepare_symbian.py <<'EOF_SM64'
          #!/usr/bin/env python3
          """Host pass for the Symbian build.

          1. runs the real sm64ex Makefile (TARGET_SYMBIAN=1, fake compiler) so every generated source is produced
             from the user's ROM: textures, text, sound banks, anim/demo data, skyboxes
          2. lists the C sources, writes uniquely named wrapper .c files (abld names objects by basename)
          3. fills symbian/app/group/sm64.mmp.in -> sm64.mmp
          usage: prepare_symbian.py [--opt -O2] [--fpu vfp|softvfp] [--gccinc DIR] [--skip-make]
          """
          import argparse, os, re, subprocess, sys, glob

          ROOT = os.path.abspath(os.path.join(os.path.dirname(__file__), '..', '..'))
          os.chdir(ROOT)
          ap = argparse.ArgumentParser()
          ap.add_argument('--opt', default='-O2')
          ap.add_argument('--fpu', default='vfp')
          ap.add_argument('--gccinc', default='/usr/include')
          ap.add_argument('--skip-make', action='store_true')
          ap.add_argument('--version', default='us')
          argv = []
          for a in sys.argv[1:]:
              if argv and argv[-1] in ('--opt', '--fpu') and a.startswith('-'):
                  argv[-1] += '=' + a        # argparse would take '-O2' for an option
              else:
                  argv.append(a)
          args = ap.parse_args(argv)

          FAKE = os.path.join(ROOT, 'symbian/tools/fakecc.sh')
          MK = ['make', 'TARGET_SYMBIAN=1', 'TARGET_IOS=0', 'VERSION=' + args.version, 'CC=' + FAKE, 'CXX=' + FAKE]
          J = ['-j%d' % (os.cpu_count() or 2)]

          def run(cmd, check=True):
              print('+', ' '.join(cmd[:8]), '...' if len(cmd) > 8 else '', flush=True)
              r = subprocess.run(cmd)
              if check and r.returncode:
                  sys.exit('failed: %s' % cmd[0])
              return r.returncode

          # host tools must be built with the real compiler (the fake one would be inherited by tools/Makefile)
          run(['make', '-C', 'tools'])   # serial: tools/Makefile has an ordering race under -j

          # ---- variables ----
          DUMP = os.path.join(ROOT, 'symbian/tools/.dump.mk')
          VARS = ['C_FILES', 'M_FILES', 'GODDARD_C_FILES', 'ULTRA_C_FILES', 'GENERATED_C_FILES', 'BUILD_DIR',
                  'SOUND_BIN_DIR', 'VERSION_CFLAGS', 'GRUCODE_CFLAGS', 'BACKEND_CFLAGS', 'CRASH_TEXTURE_C_FILES']
          with open(DUMP, 'w') as f:
              f.write('symbian-dump:\n')
              for v in VARS:
                  f.write('\t@echo "SYMDUMP:%s:$(%s)"\n' % (v, v))
          out = subprocess.run(MK + ['-s', '-f', 'Makefile', '-f', DUMP, 'symbian-dump'], stdout=subprocess.PIPE, text=True)
          if out.returncode:
              sys.exit('make (variable dump) failed - is baserom.%s.z64 in the repo root?' % args.version)
          V = {}
          for line in out.stdout.splitlines():
              if line.startswith('SYMDUMP:'):
                  _, k, val = line.split(':', 2)
                  V[k] = val.split()
                  V[k + '_RAW'] = val
          BUILD = V['BUILD_DIR'][0]

          # ---- generate ----
          if not args.skip_make:
              pngs = []
              for d in ('actors', 'levels', 'textures'):
                  for dp, dn, fn in os.walk(d):
                      if 'skyboxes' in dp or 'skybox_tiles' in dp:
                          continue
                      for n in fn:
                          if n.endswith('.png'):
                              pngs.append(os.path.join(BUILD, dp, n[:-4] + '.inc.c'))
              # pass 1: every texture include (compiler-discovered deps do not exist with a fake compiler)
              for i in range(0, len(pngs), 400):
                  run(MK + ['-k'] + J + pngs[i:i + 400], check=False)
              # pass 2: everything else (text, sound, anims, demos, skyboxes, headers)
              run(MK + ['-k'] + J + ['all'], check=False)
              extra = [BUILD + '/include/text_strings.h', BUILD + '/text/%s/define_text.inc.c' % args.version,
                       BUILD + '/text/%s/define_courses.inc.c' % args.version]
              extra += V.get('GENERATED_C_FILES', []) + V.get('CRASH_TEXTURE_C_FILES', [])
              run(MK + ['-k'] + J + extra, check=False)

          missing = [f for f in V.get('GENERATED_C_FILES', []) if not os.path.exists(f)]
          snd = os.path.join(V['SOUND_BIN_DIR'][0], 'sound_data.ctl.inc.c')
          if not os.path.exists(snd):
              missing.append(snd)
          if missing:
              sys.exit('asset generation incomplete, missing:\n  ' + '\n  '.join(missing))

          # ---- sources ----
          EXCL = re.compile(r'(sdl|dxgi|direct3d|wasapi|emscripten|xinput|discord|opengl_legacy|uikit)', re.I)
          src = []
          for f in V['C_FILES'] + V['GODDARD_C_FILES'] + V['ULTRA_C_FILES']:
              if f.startswith(BUILD + '/'):
                  continue
              if EXCL.search(os.path.basename(f)) and 'symbian' not in f:
                  continue
              src.append(f)
          src += V['GENERATED_C_FILES']
          src.append('sound/sound_data.c')

          # ObjC files that are plain C once '#import' is dropped (iOS-only branches are TARGET_OS_TV, undefined here)
          gen_dir = os.path.join(BUILD, 'symbian_gen')
          os.makedirs(gen_dir, exist_ok=True)
          for m in ('src/pc/configfile.m', 'src/pc/ultra_reimplementation.m'):
              txt = open(m).read()
              txt = re.sub(r'^\s*#import.*$', '', txt, flags=re.M)
              dst = os.path.join(gen_dir, os.path.basename(m)[:-2] + '.c')
              open(dst, 'w').write(txt)
              src.append(dst)

          seen, uniq = set(), []
          for f in src:
              if f not in seen:
                  seen.add(f)
                  uniq.append(f)
          src = [f for f in uniq if os.path.exists(f)]

          # ---- wrappers: gen/w_<n>_<base>.c  #include the real file; the object name is then unique ----
          wr_dir = os.path.join(ROOT, 'symbian/app/gen')
          os.makedirs(wr_dir, exist_ok=True)
          for old in glob.glob(wr_dir + '/*.c'):
              os.remove(old)
          names = []
          for i, f in enumerate(sorted(src)):
              base = re.sub(r'[^A-Za-z0-9]', '_', os.path.splitext(f)[0])[-48:]
              name = 'w%04d_%s.c' % (i, base)
              with open(os.path.join(wr_dir, name), 'w') as w:
                  # the include path is resolved against the repo root (USERINCLUDE ../../..)
                  w.write('/* generated */\n#include "%s"\n' % f)
              names.append(name)
          assert len(set(n.lower() for n in names)) == len(names), 'object name collision'

          # ---- mmp ----
          tpl = open('symbian/app/group/sm64.mmp.in').read()
          macros = set()
          for k in ('VERSION_CFLAGS_RAW', 'GRUCODE_CFLAGS_RAW', 'BACKEND_CFLAGS_RAW'):
              for t in V.get(k, '').split():
                  if t.startswith('-D'):
                      macros.add(t[2:])
          macros.discard('')
          have = set(re.findall(r'^MACRO\s+(\S+)', tpl, flags=re.M))
          extra_macros = ''.join('MACRO           %s\n' % m for m in sorted(macros) if m not in have
                                 and not m.startswith(('GIT_HASH', 'COMPILE_TIME', 'NIGHTLY')))
          game = 'SOURCEPATH      ../gen\n' + ''.join('SOURCE          %s\n' % n for n in names)
          inc = ''.join('USERINCLUDE     ../../../%s\n' % d for d in
                        ('.', 'include', 'src', BUILD, BUILD + '/include', 'src/pc/symbian'))
          fpu = '-march=armv6 -mfpu=vfp -mfloat-abi=softfp' if args.fpu == 'vfp' else '-march=armv6 -mfloat-abi=soft'
          mmp = (tpl.replace('@GAME_SOURCES@', game).replace('@USERINCLUDES@', inc).replace('@OPT@', args.opt)
                 .replace('@FPU@', fpu).replace('@GCCINC@', args.gccinc))
          mmp = mmp.replace('MACRO           NDEBUG\n', 'MACRO           NDEBUG\n' + extra_macros, 1)
          open('symbian/app/group/sm64.mmp', 'w').write(mmp)
          print('sources: %d wrappers, macros: %s' % (len(names), sorted(macros)))
          EOF_SM64
          cat > /tmp/sm64_symbian.patch <<'EOF_SM64'
          --- a/Makefile
          +++ b/Makefile
          @@ -55,6 +55,19 @@
           # Enable Discord Rich Presence
           DISCORDRPC ?= 0
           
          +# Build for Symbian^3 (GLES2, Open C, GCCE). The real compile/link is done by the Symbian toolchain (abld);
          +# this Makefile is only used on the host to generate assets (symbian/tools/prepare_symbian.py).
          +TARGET_SYMBIAN ?= 0
          +ifeq ($(TARGET_SYMBIAN),1)
          +  TARGET_IOS := 0
          +  OSX_BUILD := 0
          +  RENDER_API := GL
          +  WINDOW_API := SYMBIAN
          +  AUDIO_API := SYMBIAN
          +  CONTROLLER_API := SYMBIAN
          +  NO_BZERO_BCOPY := 1
          +endif
          +
           # Various workarounds for weird toolchains
           
           NO_BZERO_BCOPY ?= 0
          @@ -225,6 +238,10 @@
                 VERSION_CFLAGS += -DUSE_GLES
           endif
           
          +ifeq ($(TARGET_SYMBIAN),1)
          +     VERSION_CFLAGS += -DUSE_GLES -DTARGET_SYMBIAN
          +endif
          +
           ifeq ($(OSX_BUILD),1) # Modify GFX & SDL2 for OSX GL
                VERSION_CFLAGS += -DOSX_BUILD
           endif
          @@ -331,6 +348,10 @@
             SRC_DIRS += src/pc/discord
           endif
           
          +ifeq ($(TARGET_SYMBIAN),1)
          +  SRC_DIRS += src/pc/symbian
          +endif
          +
           ifdef TARGET_OS_IOS
             SRC_DIRS += src/ios/ios
           endif
          @@ -948,12 +969,19 @@
           $(BUILD_DIR)/rsp/%.bin $(BUILD_DIR)/rsp/%_data.bin: rsp/%.s
           	$(RSPASM) -sym $@.sym -definelabel $(VERSION_DEF) 1 -definelabel $(GRUCODE_DEF) 1 -strequ CODE_FILE $(BUILD_DIR)/rsp/$*.bin -strequ DATA_FILE $(BUILD_DIR)/rsp/$*_data.bin $<
           
          +ifeq ($(TARGET_SYMBIAN),1)
          +# the host generates data for an ARM11 little-endian 32-bit target
          +$(ENDIAN_BITWIDTH): tools/determine-endian-bitwidth.c
          +	@mkdir -p $(@D)
          +	echo "--endian little --bitwidth 32" > $@
          +else
           $(ENDIAN_BITWIDTH): tools/determine-endian-bitwidth.c
           	$(CC) -c $(CFLAGS) -o $@.dummy2 $< 2>$@.dummy1; true
           	grep -o 'msgbegin --endian .* --bitwidth .* msgend' $@.dummy1 > $@.dummy2
           	head -n1 <$@.dummy2 | cut -d' ' -f2-5 > $@
           	@rm $@.dummy1
           	@rm $@.dummy2
          +endif
           
           $(SOUND_BIN_DIR)/sound_data.ctl: sound/sound_banks/ $(SOUND_BANK_FILES) $(SOUND_SAMPLE_AIFCS) $(ENDIAN_BITWIDTH)
           	$(PYTHON) tools/assemble_sound.py $(BUILD_DIR)/sound/samples/ sound/sound_banks/ $(SOUND_BIN_DIR)/sound_data.ctl $(SOUND_BIN_DIR)/sound_data.tbl $(VERSION_CFLAGS) $$(cat $(ENDIAN_BITWIDTH))
          --- a/sound/sound_data.c
          +++ b/sound/sound_data.c
          @@ -1,15 +1,15 @@
          -unsigned char gSoundDataADSR[] = {
          +__attribute__((aligned(16))) unsigned char gSoundDataADSR[] = {
           #include "sound/sound_data.ctl.inc.c"
           };
           
          -unsigned char gSoundDataRaw[] = {
          +__attribute__((aligned(16))) unsigned char gSoundDataRaw[] = {
           #include "sound/sound_data.tbl.inc.c"
           };
           
          -unsigned char gMusicData[] = {
          +__attribute__((aligned(16))) unsigned char gMusicData[] = {
           #include "sound/sequences.bin.inc.c"
           };
           
          -unsigned char gBankSetsData[] = {
          +__attribute__((aligned(16))) unsigned char gBankSetsData[] = {
           #include "sound/bank_sets.inc.c"
           };
          --- a/src/pc/cliopts.c
          +++ b/src/pc/cliopts.c
          @@ -4,6 +4,9 @@
           #include "pc_main.h"
           #include "platform.h"
           #include "macros.h"
          +#ifdef TARGET_SYMBIAN
          +#include "symbian/sym_host.h"
          +#endif
           
           #include <strings.h>
           #include <stdlib.h>
          @@ -45,6 +48,10 @@
               // Initialize options with false values.
               memset(&gCLIOpts, 0, sizeof(gCLIOpts));
           
          +#ifdef TARGET_SYMBIAN
          +    arg_string("--savepath", sym_user_dir(), gCLIOpts.SavePath);
          +    arg_string("--gamedir", sym_user_dir(), gCLIOpts.GameDir);
          +#else
               char spbuf[512];
               strcpy(spbuf, getenv("HOME"));
               strcat(spbuf, "/Documents");
          @@ -55,6 +62,8 @@
               strcat(gdbuf, "/Documents");
               arg_string("--gamedir", gdbuf, gCLIOpts.GameDir);
               
          +#endif
          +
               for (int i = 1; i < argc; i++) {
                   if (strcmp(argv[i], "--skip-intro") == 0) // Skip Peach Intro
                       gCLIOpts.SkipIntro = 1;
          --- a/src/pc/gfx/gfx_opengl.c
          +++ b/src/pc/gfx/gfx_opengl.c
          @@ -28,6 +28,11 @@
           # else
           #  include <SDL2/SDL_opengl.h>
           # endif
          +#elif defined(WAPI_SYMBIAN)
          +# include <GLES2/gl2.h>
          +# include <GLES2/gl2ext.h>
          +# include "../symbian/sym_host.h"
          +# define fprintf(f, ...) sym_log(__VA_ARGS__) /* shader logs end up in sm64.log */
           #elif defined(WAPI_SDL1)
           # include <SDL/SDL.h>
           # ifndef GLEW_STATIC
          @@ -313,13 +318,13 @@
           
               if (used_textures[0] || used_textures[1]) {
                   if (configFiltering == 2) {
          -            append_line(fs_buf, &fs_len, "#define TEX_OFFSET(off) texture2D(tex, texCoord - (off)/texSize)");
          +            append_line(fs_buf, &fs_len, "vec4 texOff(in sampler2D tex, in vec2 texCoord, in vec2 texSize, in vec2 off) { return texture2D(tex, texCoord - off/texSize); }");
                       append_line(fs_buf, &fs_len, "vec4 filter3point(in sampler2D tex, in vec2 texCoord, in vec2 texSize) {");
                       append_line(fs_buf, &fs_len, "  vec2 offset = fract(texCoord*texSize - vec2(0.5));");
                       append_line(fs_buf, &fs_len, "  offset -= step(1.0, offset.x + offset.y);");
          -            append_line(fs_buf, &fs_len, "  vec4 c0 = TEX_OFFSET(offset);");
          -            append_line(fs_buf, &fs_len, "  vec4 c1 = TEX_OFFSET(vec2(offset.x - sign(offset.x), offset.y));");
          -            append_line(fs_buf, &fs_len, "  vec4 c2 = TEX_OFFSET(vec2(offset.x, offset.y - sign(offset.y)));");
          +            append_line(fs_buf, &fs_len, "  vec4 c0 = texOff(tex, texCoord, texSize, offset);");
          +            append_line(fs_buf, &fs_len, "  vec4 c1 = texOff(tex, texCoord, texSize, vec2(offset.x - sign(offset.x), offset.y));");
          +            append_line(fs_buf, &fs_len, "  vec4 c2 = texOff(tex, texCoord, texSize, vec2(offset.x, offset.y - sign(offset.y)));");
                       append_line(fs_buf, &fs_len, "  return c0 + abs(offset.x)*(c1-c0) + abs(offset.y)*(c2-c0);");
                       append_line(fs_buf, &fs_len, "}");
                       append_line(fs_buf, &fs_len, "vec4 sampleTex(in sampler2D tex, in vec2 uv, in vec2 texSize, in bool dofilter) {");
          --- a/src/pc/platform.c
          +++ b/src/pc/platform.c
          @@ -80,7 +80,23 @@
               sys_fatal_impl(msg);
           }
           
          -#ifdef HAVE_SDL2
          +#if defined(TARGET_SYMBIAN)
          +
          +#include "symbian/sym_host.h"
          +
          +const char *sys_user_path(void) {
          +    return sym_user_dir();
          +}
          +
          +const char *sys_exe_path(void) {
          +    return sym_user_dir();
          +}
          +
          +static void sys_fatal_impl(const char *msg) {
          +    sym_fatal(msg);
          +}
          +
          +#elif defined(HAVE_SDL2)
           
           // we can just ask SDL for most of this shit if we have it
           #include <SDL2/SDL.h>
          EOF_SM64
          patch -p1 --no-backup-if-mismatch < /tmp/sm64_symbian.patch
          chmod +x symbian/tools/fakecc.sh symbian/tools/prepare_symbian.py

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libcapstone-dev pkg-config libpng-dev libsdl2-dev binutils-mips-linux-gnu || true

      - name: Fetch ROM (yours, from Google Drive)
        env:
          ROM_ID: ${{ inputs.rom_file_id || secrets.DRIVE_ROM_ID }}
        run: |
          set -euo pipefail
          [ -n "${ROM_ID:-}" ] || { echo "::error::ROM id missing (rom_file_id or secret DRIVE_ROM_ID)"; exit 1; }
          ROM_ID="$(echo "$ROM_ID" | tr -d ' \r\n' | sed -E 's#.*/d/([A-Za-z0-9_-]+).*#\1#; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#')"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          "$RUNNER_TEMP/venv/bin/gdown" "$ROM_ID" -O baserom.us.z64
          sha1sum baserom.us.z64
          grep -q "$(sha1sum baserom.us.z64 | cut -d' ' -f1)" sm64.us.sha1 || { echo "::error::ROM is not the US z64 (big-endian) dump"; exit 1; }

      - name: Generate (assets, wrappers, mmp)
        run: |
          set -eo pipefail
          python3 symbian/tools/prepare_symbian.py --opt="${{ inputs.opt }}" --fpu="${{ inputs.fpu }}" --gccinc=@GCCINC@ 2>&1 | tee prepare.log

      - name: Host syntax check of the port's portable C
        run: |
          set -e
          F="-fsyntax-only -fsigned-char -I include -I build/us_pc -I build/us_pc/include -I src -I . -I src/pc/symbian -DVERSION_US -D_LANGUAGE_C -DNON_MATCHING -DAVOID_UB -DUSE_GLES -DTARGET_SYMBIAN -DRAPI_GL=1 -DWAPI_SYMBIAN=1 -DAAPI_SYMBIAN=1 -DCAPI_SYMBIAN=1 -DNO_BZERO_BCOPY -DEXT_OPTIONS_MENU -DF3DEX_GBI_2E"
          for f in src/pc/symbian/sym_host.c src/pc/gfx/gfx_symbian.c src/pc/audio/audio_symbian.c src/pc/controller/controller_symbian.c src/pc/pc_main_symbian.c; do gcc $F $f; done

      - name: Pack tree
        run: |
          rm -f baserom.*.z64
          tar --exclude=.git --exclude='build/us_pc/**/*.o' -czf "$RUNNER_TEMP/tree.tgz" .

      - uses: actions/upload-artifact@v4
        with:
          name: tree
          retention-days: 1
          path: ${{ runner.temp }}/tree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepare-log
          path: prepare.log
          if-no-files-found: ignore

  build-sis:
    name: Build sm64.sisx
    needs: assets
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tree
          path: .
      - name: Unpack
        run: tar -xzf tree.tgz && rm tree.tgz
      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain
      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"
      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}
      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh
      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check Open C and GLES in the SDK
        run: |
          source toolchain/Scripts/env.sh
          ls "${EPOCROOT}epoc32/include/stdapis/stdio.h" "${EPOCROOT}epoc32/include/GLES2/gl2.h" "${EPOCROOT}epoc32/include/EGL/egl.h" || true
          arm-none-symbianelf-gcc -print-file-name=include
      - name: Build sm64
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          GCCINC="$(arm-none-symbianelf-gcc -print-file-name=include)"
          cd symbian/app/group
          sed -i.bak "s|@GCCINC@|$GCCINC|" sm64.mmp
          bldmake bldfiles
          if ! abld build -keepgoing gcce urel; then
            echo "::warning::build failed, retrying without multi-touch (Z3_MULTITOUCH)"
            sed -i.bak2 "/Z3_MULTITOUCH/d" sm64.mmp
            abld reallyclean gcce urel || true
            bldmake bldfiles
            abld build gcce urel
          fi
          test -f "${EPOCROOT}epoc32/release/gcce/urel/sm64.exe"
          ls -l "${EPOCROOT}epoc32/release/gcce/urel/sm64.exe"
      - name: Package SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/sm64.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: sm64-symbian3
          path: dist/sm64.sisx
          if-no-files-found: error
