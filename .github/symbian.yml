          // Super Mario 64 (sm64ex) for Symbian^3 / Open C / OpenGL ES 2.0.
          // sm64.mmp is generated from this file by symbian/tools/prepare_symbian.py.
          #include <platform_paths.hrh>

          TARGET          sm64.exe
          TARGETTYPE      exe
          UID             0x100039CE 0xE5A64D64
          SECUREID        0xE5A64D64
          VENDORID        0
