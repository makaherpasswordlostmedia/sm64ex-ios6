name: Build Super Mario 64 for Symbian^3 (SIS, GLES2)

# SELF-CONTAINED: this single file carries the whole Symbian port (new files + patch) and applies it to the checked-out
# sm64ex-ios6 sources. Put it at .github/workflows/symbian.yml, nothing else to copy.
#
# Run: Actions -> this workflow -> Run workflow.
# ROM: your own US ROM (z64, big-endian) on Google Drive "anyone with the link": fill rom_file_id or save secret DRIVE_ROM_ID.
# The ROM is only used on the runner to extract assets into the build; the .sisx is built from that data.
# Toolchain: https://github.com/fieldops-dev/symbian3-toolchain (macOS runner, first run builds GCC ~2 h and caches it).

on:
  workflow_dispatch:
    inputs:
      rom_file_id:
        description: "Google Drive ID or link of your US .z64 (empty = secret DRIVE_ROM_ID)"
        required: false
        default: ""
        type: string
      opt:
        description: "GCC optimisation"
        required: true
        default: "-O2"
        type: choice
        options: ["-O2", "-Os", "-O3"]
      fpu:
        description: "vfp = hardware FPU (ARM1176, N8/C7/E7). softvfp = fallback if the app crashes at start"
        required: true
        default: "vfp"
        type: choice
        options: ["vfp", "softvfp"]
      runner:
        description: "macOS runner label for the Symbian build"
        required: true
        default: "macos-15"
        type: choice
        options: ["macos-15", "macos-14", "macos-latest", "macos-26"]

permissions:
  contents: read

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  assets:
    name: Extract assets, generate sources and mmp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Write port sources and patch the repo (everything is embedded in this file)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname src/pc/audio/audio_symbian.c)"
          cat > src/pc/audio/audio_symbian.c <<'EOF_SM64'
          // Audio backend for Symbian^3. The game produces 32 kHz stereo s16; the C++ side
          // (CMdaAudioOutputStream, 44.1 kHz) pulls through Sym_AudioPull, which resamples
          // linearly. Game and stream callbacks both run on the UI thread: no locking.
          #ifdef AAPI_SYMBIAN

          #include <stdint.h>
          #include <string.h>

          #include "audio_api.h"
          #include "audio_symbian.h"
          #include "../symbian/sym_host.h"

          #define RING_FRAMES 8192u /* power of two */
          #define IN_RATE 32000u
          #define OUT_RATE 44100u

          static int16_t g_ring[RING_FRAMES * 2];
          static uint32_t g_rd, g_wr; /* in frames */
          static uint32_t g_phase;    /* 16.16 */
          static int g_sound = 1;

          static bool audio_symbian_init(void) { return true; }

          static int audio_symbian_buffered(void) { return (int)(g_wr - g_rd); }

          static int audio_symbian_get_desired_buffered(void) { return 1100; }

          static void audio_symbian_play(const uint8_t *buf, size_t len) {
              const int16_t *in = (const int16_t *)buf;
              uint32_t frames = (uint32_t)(len / 4);
              if (RING_FRAMES - (g_wr - g_rd) < frames) return; /* overrun: drop */
              for (uint32_t i = 0; i < frames; i++) {
                  uint32_t idx = ((g_wr + i) & (RING_FRAMES - 1)) * 2;
                  g_ring[idx] = in[i * 2];
                  g_ring[idx + 1] = in[i * 2 + 1];
              }
              g_wr += frames;
          }

          static void audio_symbian_shutdown(void) {}

          void Sym_SetSound(int on) { g_sound = on; }

          void Sym_AudioPull(short *dst, int frames) {
              const uint32_t step = (IN_RATE << 16) / OUT_RATE;
              for (int i = 0; i < frames; i++) {
                  if (g_wr - g_rd < 2) {
                      memset(dst + i * 2, 0, (size_t)(frames - i) * 4);
                      return;
                  }
                  {
                      uint32_t i0 = (g_rd & (RING_FRAMES - 1)) * 2;
                      uint32_t i1 = ((g_rd + 1) & (RING_FRAMES - 1)) * 2;
                      int32_t f = (int32_t)(g_phase & 0xFFFF);
                      int32_t l = g_ring[i0] + (((g_ring[i1] - g_ring[i0]) * f) >> 16);
                      int32_t r = g_ring[i0 + 1] + (((g_ring[i1 + 1] - g_ring[i0 + 1]) * f) >> 16);
                      dst[i * 2] = g_sound ? (short)l : 0;
                      dst[i * 2 + 1] = g_sound ? (short)r : 0;
                  }
                  g_phase += step;
                  g_rd += g_phase >> 16;
                  g_phase &= 0xFFFF;
              }
          }

          struct AudioAPI audio_symbian = {
              audio_symbian_init,
              audio_symbian_buffered,
              audio_symbian_get_desired_buffered,
              audio_symbian_play,
              audio_symbian_shutdown
          };

          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/audio/audio_symbian.h)"
          cat > src/pc/audio/audio_symbian.h <<'EOF_SM64'
          #ifndef AUDIO_SYMBIAN_H
          #define AUDIO_SYMBIAN_H
          #include "audio_api.h"
          extern struct AudioAPI audio_symbian;
          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/controller/controller_entry_point_symbian.c)"
          cat > src/pc/controller/controller_entry_point_symbian.c <<'EOF_SM64'
          #ifdef TARGET_SYMBIAN
          #include "lib/src/libultra_internal.h"
          #include "lib/src/osContInternal.h"
          #include "macros.h"

          #include "../configfile.h"

          #include "controller_recorded_tas.h"
          #include "controller_keyboard.h"
          #include "controller_sdl.h"
          #ifdef CAPI_SYMBIAN
          #include "controller_symbian.h"
          #endif
          #ifdef TARGET_OS_IOS
          #include "controller_touchscreen.h"
          #endif

          // Analog camera movement by Pathétique (github.com/vrmiguel), y0shin and Mors
          // Contribute or communicate bugs at github.com/vrmiguel/sm64-analog-camera

          static struct ControllerAPI *controller_implementations[] = {
              &controller_recorded_tas,
              #if defined(CAPI_SDL2) || defined(CAPI_SDL1)
              &controller_sdl,
              #endif
              &controller_keyboard,
          #ifdef CAPI_SYMBIAN
              &controller_symbian,
          #endif
          #ifdef TARGET_OS_IOS
              &controller_touchscreen,
          #endif
          };

          s32 osContInit(UNUSED OSMesgQueue *mq, u8 *controllerBits, UNUSED OSContStatus *status) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++)
                  controller_implementations[i]->init();
              *controllerBits = 1;
              return 0;
          }

          s32 osMotorStart(UNUSED void *pfs) {
              // Since rumble stops by osMotorStop, its duration is not nessecary.
              // Set it to 5 seconds and hope osMotorStop() is called in time.
              if (configRumbleStrength)
                  controller_rumble_play(configRumbleStrength / 100.0f, 5.0f);
              return 0;
          }

          s32 osMotorStop(UNUSED void *pfs) {
              if (configRumbleStrength)
                  controller_rumble_stop();
              return 0;
          }

          u32 osMotorInit(UNUSED OSMesgQueue *mq, UNUSED void *pfs, UNUSED s32 port) {
              return 0; // rumble is initialized in the specific backend's init function
          }

          s32 osContStartReadData(UNUSED OSMesgQueue *mesg) {
              return 0;
          }

          void osContGetReadData(OSContPad *pad) {
              pad->button = 0;
              pad->stick_x = 0;
              pad->stick_y = 0;
              pad->ext_stick_x = 0;
              pad->ext_stick_y = 0;
              pad->errnum = 0;

              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  controller_implementations[i]->read(pad);
              }
          }

          u32 controller_get_raw_key(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  u32 vk = controller_implementations[i]->rawkey();
                  if (vk != VK_INVALID) return vk + controller_implementations[i]->vkbase;
              }
              return VK_INVALID;
          }

          void controller_shutdown(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->shutdown)
                      controller_implementations[i]->shutdown();
              }
          }

          void controller_reconfigure(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->reconfig)
                      controller_implementations[i]->reconfig();
              }
          }

          void controller_rumble_play(float str, float time) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->rumble_play)
                      controller_implementations[i]->rumble_play(str, time);
              }
          }

          void controller_rumble_stop(void) {
              for (size_t i = 0; i < sizeof(controller_implementations) / sizeof(struct ControllerAPI *); i++) {
                  if (controller_implementations[i]->rumble_stop)
                      controller_implementations[i]->rumble_stop();
              }
          }
          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/controller/controller_symbian.c)"
          cat > src/pc/controller/controller_symbian.c <<'EOF_SM64'
          // Reads the state written by the Symbian UI (touch pad + keys) into the N64 pad.
          #ifdef CAPI_SYMBIAN

          #include <stdint.h>
          #include <ultra64.h>

          #include "controller_api.h"
          #include "controller_symbian.h"
          #include "../symbian/sym_host.h"

          _Static_assert(SYM_BTN_A == A_BUTTON && SYM_BTN_B == B_BUTTON && SYM_BTN_Z == Z_TRIG, "pad bits");
          _Static_assert(SYM_BTN_START == START_BUTTON && SYM_BTN_L == L_TRIG && SYM_BTN_R == R_TRIG, "pad bits");
          _Static_assert(SYM_BTN_CU == U_CBUTTONS && SYM_BTN_CD == D_CBUTTONS, "pad bits");
          _Static_assert(SYM_BTN_CL == L_CBUTTONS && SYM_BTN_CR == R_CBUTTONS, "pad bits");

          static void sym_c_init(void) {}

          static void sym_c_read(OSContPad *pad) {
              pad->button |= sym_input.buttons;
              if (sym_input.stick_x != 0 || sym_input.stick_y != 0) {
                  pad->stick_x = sym_input.stick_x;
                  pad->stick_y = sym_input.stick_y;
              }
          }

          static u32 sym_c_rawkey(void) { return VK_INVALID; }
          static void sym_c_rumble_play(float str, float time) { (void)str; (void)time; }
          static void sym_c_rumble_stop(void) {}

          struct ControllerAPI controller_symbian = {
              0,
              sym_c_init,
              sym_c_read,
              sym_c_rawkey,
              sym_c_rumble_play,
              sym_c_rumble_stop,
              NULL,
              NULL
          };

          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/controller/controller_symbian.h)"
          cat > src/pc/controller/controller_symbian.h <<'EOF_SM64'
          #ifndef CONTROLLER_SYMBIAN_H
          #define CONTROLLER_SYMBIAN_H
          #include "controller_api.h"
          extern struct ControllerAPI controller_symbian;
          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/gfx/gfx_symbian.c)"
          cat > src/pc/gfx/gfx_symbian.c <<'EOF_SM64'
          // Window manager backend for Symbian^3. EGL lives in the C++ host (symbian/app);
          // the game and the GL context share the UI thread, so there is nothing to marshal.
          #ifdef WAPI_SYMBIAN

          #include <stdint.h>
          #include <stdbool.h>

          #include "gfx_window_manager_api.h"
          #include "gfx_symbian.h"
          #include "../configfile.h"
          #include "../symbian/sym_host.h"

          static int g_w = 640, g_h = 360;
          static void (*g_run)(void);

          static void gfx_symbian_init(const char *window_title) {
              (void)window_title;
              Sym_GlSize(&g_w, &g_h);
              configWindow.w = g_w;
              configWindow.h = g_h;
              sym_log("[GFX] %dx%d", g_w, g_h);
          }

          static void gfx_symbian_set_keyboard_callbacks(kb_callback_t kd, kb_callback_t ku, void (*all_up)(void)) {
              (void)kd; (void)ku; (void)all_up;
          }

          static void gfx_symbian_set_touchscreen_callbacks(void (*d)(void *), void (*m)(void *), void (*u)(void *)) {
              (void)d; (void)m; (void)u;
          }

          static void gfx_symbian_main_loop(void (*run_one_game_iter)(void)) {
              g_run = run_one_game_iter; // stepped by the UI timer, never loops here
              (void)g_run;
          }

          static void gfx_symbian_get_dimensions(uint32_t *width, uint32_t *height) {
              Sym_GlSize(&g_w, &g_h);
              *width = (uint32_t)g_w;
              *height = (uint32_t)g_h;
          }

          static void gfx_symbian_handle_events(void) {}
          static bool gfx_symbian_start_frame(void) { return true; }
          static void gfx_symbian_swap_buffers_begin(void) {}

          static void gfx_symbian_swap_buffers_end(void) {
              sym_overlay_draw();
              Sym_GlSwap();
          }

          static double gfx_symbian_get_time(void) { return 0.0; }
          static void gfx_symbian_shutdown(void) {}

          static void gfx_symbian_reset_dimension_and_pos(void) {
              configWindow.w = g_w;
              configWindow.h = g_h;
              configWindow.reset = false;
              configWindow.settings_changed = false;
          }

          struct GfxWindowManagerAPI gfx_symbian = {
              gfx_symbian_init,
              gfx_symbian_set_keyboard_callbacks,
              gfx_symbian_set_touchscreen_callbacks,
              gfx_symbian_main_loop,
              gfx_symbian_get_dimensions,
              gfx_symbian_handle_events,
              gfx_symbian_start_frame,
              gfx_symbian_swap_buffers_begin,
              gfx_symbian_swap_buffers_end,
              gfx_symbian_get_time,
              gfx_symbian_shutdown,
              gfx_symbian_reset_dimension_and_pos
          };

          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/gfx/gfx_symbian.h)"
          cat > src/pc/gfx/gfx_symbian.h <<'EOF_SM64'
          #ifndef GFX_SYMBIAN_H
          #define GFX_SYMBIAN_H
          #include "gfx_window_manager_api.h"
          extern struct GfxWindowManagerAPI gfx_symbian;
          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/pc_main_symbian.c)"
          cat > src/pc/pc_main_symbian.c <<'EOF_SM64'
          // Game entry for Symbian^3 (replaces pc_main.m). Same flow as the ios32 port, but the
          // loop is driven from outside: Sym_Start() -> main_func(), then Sym_Frame() per tick.
          #ifdef TARGET_SYMBIAN
          #include <stdlib.h>
          #include <stdio.h>

          #include "sm64.h"

          #include "game/memory.h"
          #include "audio/external.h"

          #include "gfx/gfx_pc.h"
          #include "gfx/gfx_opengl.h"
          #include "gfx/gfx_symbian.h"
          #include "audio/audio_symbian.h"
          #include "audio/audio_api.h"
          #include "audio/audio_null.h"

          #include "pc_main.h"
          #include "cliopts.h"
          #include "configfile.h"
          #include "controller/controller_api.h"
          #include "controller/controller_keyboard.h"
          #include "fs/fs.h"

          #include "game/game_init.h"
          #include "game/main.h"
          #include "game/thread6.h"
          #include "game/display.h"

          #include "symbian/sym_host.h"

          OSMesg D_80339BEC;
          OSMesgQueue gSIEventMesgQueue;

          s8 gResetTimer;
          s8 D_8032C648;
          s8 gDebugLevelSelect;
          s8 gShowProfiler;
          s8 gShowDebugText;

          s32 gRumblePakPfs;
          struct RumbleData gRumbleDataQueue[3];
          struct StructSH8031D9B0 gCurrRumbleSettings;

          static struct AudioAPI *audio_api;
          static struct GfxWindowManagerAPI *wm_api;
          static struct GfxRenderingAPI *rendering_api;

          extern void gfx_run(Gfx *commands);
          extern void thread5_game_loop(void *arg);
          extern void create_next_audio_buffer(s16 *samples, u32 num_samples);
          void game_loop_one_iteration(void);

          static bool inited = false;
          static int g_render = 1;

          void dispatch_audio_sptask(struct SPTask *spTask) {
              (void)spTask;
          }

          void set_vblank_handler(s32 index, struct VblankHandler *handler, OSMesgQueue *queue, OSMesg *msg) {
              (void)index; (void)handler; (void)queue; (void)msg;
          }

          void send_display_list(struct SPTask *spTask) {
              if (!inited || !g_render) return;
              gfx_run((Gfx *)spTask->task.t.data_ptr);
          }

          #ifdef VERSION_EU
          #define SAMPLES_HIGH 656
          #define SAMPLES_LOW 640
          #else
          #define SAMPLES_HIGH 544
          #define SAMPLES_LOW 528
          #endif

          void sm64_symbian_frame(int render) {
              g_render = render;
              if (render) gfx_start_frame();

              {
                  const f32 master_mod = (f32)configMasterVolume / 127.0f;
                  set_sequence_player_volume(SEQ_PLAYER_LEVEL, (f32)configMusicVolume / 127.0f * master_mod);
                  set_sequence_player_volume(SEQ_PLAYER_SFX, (f32)configSfxVolume / 127.0f * master_mod);
                  set_sequence_player_volume(SEQ_PLAYER_ENV, (f32)configEnvVolume / 127.0f * master_mod);
              }

              game_loop_one_iteration();
              thread6_rumble_loop(NULL);

              {
                  int samples_left = audio_api->buffered();
                  u32 num_audio_samples = samples_left < audio_api->get_desired_buffered() ? SAMPLES_HIGH : SAMPLES_LOW;
                  s16 audio_buffer[SAMPLES_HIGH * 2 * 2];
                  for (int i = 0; i < 2; i++)
                      create_next_audio_buffer(audio_buffer + i * (num_audio_samples * 2), num_audio_samples);
                  audio_api->play((u8 *)audio_buffer, 2 * num_audio_samples * 4);
              }

              if (render) gfx_end_frame();
          }

          void audio_shutdown(void) {
              if (audio_api) {
                  if (audio_api->shutdown) audio_api->shutdown();
                  audio_api = NULL;
              }
          }

          void game_deinit(void) {
              if (!inited) return;
              inited = false;
              configfile_save(configfile_name());
              controller_shutdown();
              audio_shutdown();
              gfx_shutdown();
          }

          void sm64_symbian_deinit(void) {
              game_deinit();
          }

          void game_exit(void) {
              game_deinit();
              sym_leave_frame();
          }

          void main_func(void) {
              const char *gamedir = gCLIOpts.GameDir[0] ? gCLIOpts.GameDir : FS_BASEDIR;
              const char *userpath = gCLIOpts.SavePath[0] ? gCLIOpts.SavePath : sys_user_path();
              fs_init(sys_ropaths, gamedir, userpath);

              configfile_load(configfile_name());

              {
                  const size_t poolsize = gCLIOpts.PoolSize ? gCLIOpts.PoolSize : DEFAULT_POOL_SIZE;
                  u64 *pool = malloc(poolsize);
                  if (!pool) sys_fatal("Could not alloc main pool (out of memory).");
                  main_pool_init(pool, pool + poolsize / sizeof(pool[0]));
                  gEffectsMemoryPool = mem_pool_init(0x4000, MEMORY_POOL_LEFT);
                  sym_log("main pool %u bytes", (unsigned)poolsize);
              }

              wm_api = &gfx_symbian;
              rendering_api = &gfx_opengl_api;
              audio_api = &audio_symbian;
              if (!audio_api->init()) audio_api = &audio_null;

              audio_init();
              sound_init();

              thread5_game_loop(NULL);

              gfx_current_dimensions.width = 0;
              gfx_current_dimensions.height = 0;

              gfx_init(wm_api, rendering_api, "Super Mario 64 EX (OpenGL ES)");
              wm_api->set_keyboard_callbacks(keyboard_on_key_down, keyboard_on_key_up, keyboard_on_all_keys_up);
              wm_api->set_touchscreen_callbacks(NULL, NULL, NULL);
              configWindow.settings_changed = true;
              wm_api->reset_dimension_and_pos();

              inited = true;
              wm_api->main_loop(NULL);
          }

          int sm64_symbian_init(void) {
              static char arg0[] = "sm64symbian";
              char *argv[] = { arg0, NULL };
              parse_cli_opts(1, argv);
              main_func();
              return 0;
          }

          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/symbian/sym_host.c)"
          cat > src/pc/symbian/sym_host.c <<'EOF_SM64'
          #ifdef TARGET_SYMBIAN
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdarg.h>
          #include <string.h>
          #include <setjmp.h>
          #include <sys/time.h>

          #include "sym_host.h"

          struct SymInput sym_input;
          struct SymSettings sym_cfg = { 1, 1, 55, 100, 1, 0, 0, 1 };

          static char g_dir[260] = "E:/sm64";
          static FILE *g_log;
          static char g_err[300];
          static int g_has_err, g_quit, g_started, g_armed;
          static jmp_buf g_jb;
          static SymOverlayFn g_ovl;
          static void *g_ovl_ctx;
          static int g_logic_cnt, g_render_cnt, g_fps_logic, g_fps_render;
          static uint64_t g_fps_t0;

          void sym_set_dir(const char *dir) {
              strncpy(g_dir, dir, sizeof(g_dir) - 1);
              g_dir[sizeof(g_dir) - 1] = 0;
          }

          const char *sym_user_dir(void) { return g_dir; }

          uint64_t sym_time_us(void) {
              struct timeval tv;
              gettimeofday(&tv, NULL);
              return (uint64_t)tv.tv_sec * 1000000ull + tv.tv_usec;
          }

          static void log_open(void) {
              char a[300], b[300];
              if (g_log) return;
              snprintf(a, sizeof a, "%s/sm64.log", g_dir);
              snprintf(b, sizeof b, "%s/sm64_prev.log", g_dir);
              remove(b);
              rename(a, b);
              g_log = fopen(a, "w");
          }

          void sym_log(const char *fmt, ...) {
              va_list ap;
              log_open();
              if (!g_log) return;
              va_start(ap, fmt);
              vfprintf(g_log, fmt, ap);
              va_end(ap);
              fputc('\n', g_log);
              fflush(g_log);
          }

          void sym_fatal(const char *msg) {
              sym_log("[FATAL] %s", msg);
              snprintf(g_err, sizeof g_err, "%s", msg);
              g_has_err = 1;
              if (g_armed) longjmp(g_jb, 1);
              exit(1);
          }

          void sym_request_exit(void) { g_quit = 1; }

          void sym_leave_frame(void) {
              g_quit = 1;
              if (g_armed) longjmp(g_jb, 2);
              exit(0);
          }

          const char *Sym_Error(void) { return g_has_err ? g_err : NULL; }

          void Sym_SetOverlay(SymOverlayFn fn, void *ctx) {
              g_ovl = fn;
              g_ovl_ctx = ctx;
          }

          void sym_overlay_draw(void) {
              int w, h;
              if (!g_ovl) return;
              Sym_GlSize(&w, &h);
              g_ovl(g_ovl_ctx, w, h);
          }

          /* ---------- settings ---------- */
          static int clampi(int v, int lo, int hi) { return v < lo ? lo : (v > hi ? hi : v); }

          void sym_settings_load(void) {
              char p[300], line[128];
              FILE *f;
              snprintf(p, sizeof p, "%s/touch_settings.cfg", g_dir);
              f = fopen(p, "r");
              if (!f) return;
              while (fgets(line, sizeof line, f)) {
                  char k[48];
                  int v;
                  if (sscanf(line, "%47[^=]=%d", k, &v) != 2) continue;
                  if (!strcmp(k, "sound")) sym_cfg.sound = v != 0;
                  else if (!strcmp(k, "show_pad")) sym_cfg.show_pad = v != 0;
                  else if (!strcmp(k, "opacity")) sym_cfg.opacity = clampi(v, 20, 100);
                  else if (!strcmp(k, "scale")) sym_cfg.scale = clampi(v, 70, 140);
                  else if (!strcmp(k, "float_stick")) sym_cfg.float_stick = v != 0;
                  else if (!strcmp(k, "mirror")) sym_cfg.mirror = v != 0;
                  else if (!strcmp(k, "show_fps")) sym_cfg.show_fps = v != 0;
                  else if (!strcmp(k, "frameskip")) sym_cfg.frameskip = v != 0;
              }
              fclose(f);
          }

          void sym_settings_save(void) {
              char p[300];
              FILE *f;
              snprintf(p, sizeof p, "%s/touch_settings.cfg", g_dir);
              f = fopen(p, "w");
              if (!f) return;
              fprintf(f, "sound=%d\nshow_pad=%d\nopacity=%d\nscale=%d\nfloat_stick=%d\nmirror=%d\nshow_fps=%d\nframeskip=%d\n",
                      sym_cfg.sound, sym_cfg.show_pad, sym_cfg.opacity, sym_cfg.scale, sym_cfg.float_stick,
                      sym_cfg.mirror, sym_cfg.show_fps, sym_cfg.frameskip);
              fclose(f);
          }

          /* ---------- lifecycle ---------- */
          int Sym_Start(void) {
              int r;
              if (g_started) return 0;
              g_armed = 1;
              if (setjmp(g_jb)) {
                  g_armed = 0;
                  return -1;
              }
              sym_settings_load();
              Sym_SetSound(sym_cfg.sound);
              sym_log("start, dir=%s", g_dir);
              r = sm64_symbian_init();
              g_armed = 0;
              if (r) return -1;
              g_started = 1;
              g_fps_t0 = sym_time_us();
              sym_log("game initialised");
              return 0;
          }

          int Sym_Frame(int render) {
              int jr;
              uint64_t now;
              if (!g_started || g_has_err) return -1;
              g_armed = 1;
              jr = setjmp(g_jb);
              if (jr) {
                  g_armed = 0;
                  return jr == 2 ? 1 : -1;
              }
              sm64_symbian_frame(render);
              g_armed = 0;
              g_logic_cnt++;
              if (render) g_render_cnt++;
              now = sym_time_us();
              if (now - g_fps_t0 >= 1000000ull) {
                  g_fps_logic = g_logic_cnt;
                  g_fps_render = g_render_cnt;
                  g_logic_cnt = g_render_cnt = 0;
                  g_fps_t0 = now;
              }
              return g_quit ? 1 : 0;
          }

          void Sym_Fps(int *logic, int *render) {
              *logic = g_fps_logic;
              *render = g_fps_render;
          }

          void Sym_Shutdown(void) {
              if (g_started) {
                  g_started = 0;
                  g_armed = 0;
                  sm64_symbian_deinit();
              }
              sym_settings_save();
              if (g_log) {
                  fclose(g_log);
                  g_log = NULL;
              }
          }
          #endif
          EOF_SM64
          mkdir -p "$(dirname src/pc/symbian/sym_host.h)"
          cat > src/pc/symbian/sym_host.h <<'EOF_SM64'
          #ifndef SYM_HOST_H
          #define SYM_HOST_H

          /* Symbian^3 host interface.
           * C++ UI (symbian/app) <-> C game core (sm64ex). Everything runs on the UI thread:
           * one EGL context, the game is stepped from a timer active object. */

          #include <stdint.h>
          #include <stddef.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          /* N64 pad bits, same values as include/PR/os_cont.h (checked in controller_symbian.c) */
          enum {
              SYM_BTN_CR = 0x0001, SYM_BTN_CL = 0x0002, SYM_BTN_CD = 0x0004, SYM_BTN_CU = 0x0008,
              SYM_BTN_R = 0x0010, SYM_BTN_L = 0x0020,
              SYM_BTN_START = 0x1000, SYM_BTN_Z = 0x2000, SYM_BTN_B = 0x4000, SYM_BTN_A = 0x8000
          };

          struct SymInput {
              uint16_t buttons;
              int8_t stick_x;
              int8_t stick_y;
          };
          extern struct SymInput sym_input;

          struct SymSettings {
              int sound;       /* 0/1 */
              int show_pad;    /* 0/1 */
              int opacity;     /* 20..100 */
              int scale;       /* 70..140 */
              int float_stick; /* 0/1 */
              int mirror;      /* 0/1 */
              int show_fps;    /* 0/1 */
              int frameskip;   /* 0/1 auto */
          };
          extern struct SymSettings sym_cfg;
          void sym_settings_load(void);
          void sym_settings_save(void);

          /* paths / log / time / fatal */
          void sym_set_dir(const char *dir); /* e.g. "E:/sm64" */
          const char *sym_user_dir(void);
          void sym_log(const char *fmt, ...);
          uint64_t sym_time_us(void);
          void sym_fatal(const char *msg) __attribute__((noreturn));
          void sym_request_exit(void);
          void sym_leave_frame(void) __attribute__((noreturn)); /* used by game_exit */

          /* lifecycle, called by the UI */
          int Sym_Start(void);          /* 0 ok, -1 fatal */
          int Sym_Frame(int render);    /* 0 ok, 1 quit requested, -1 fatal */
          const char *Sym_Error(void);
          void Sym_Shutdown(void);
          void Sym_Fps(int *logic, int *render);

          /* implemented in pc_main_symbian.c */
          int sm64_symbian_init(void);
          void sm64_symbian_frame(int render);
          void sm64_symbian_deinit(void);

          /* implemented by the C++ side (sm64_gl.cpp) */
          const char *Sym_GlInit(void *rwindow); /* NULL = ok, else error text */
          void Sym_GlShutdown(void);
          void Sym_GlSize(int *w, int *h);
          int Sym_GlSwap(void);

          /* overlay (touch pad, menu) drawn by the UI right before the swap */
          typedef void (*SymOverlayFn)(void *ctx, int w, int h);
          void Sym_SetOverlay(SymOverlayFn fn, void *ctx);
          void sym_overlay_draw(void);

          /* audio (audio_symbian.c) : pulls 44.1kHz stereo s16 */
          void Sym_AudioPull(short *dst, int frames);
          void Sym_SetSound(int on);

          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF_SM64
          mkdir -p "$(dirname symbian/README_SYMBIAN.md)"
          cat > symbian/README_SYMBIAN.md <<'EOF_SM64'
          # Super Mario 64 (sm64ex iOS6 fork) -> Symbian^3

          Port of the sm64ex iOS fork to Nokia N8 / C7 / E7 class devices (ARM11, GLES2, Open C, GCCE).

          ## Build
          1. Put your own US ROM (z64) on Google Drive (anyone with the link).
          2. Actions -> "Build Super Mario 64 for Symbian^3" -> Run workflow, fill `rom_file_id` (or secret `DRIVE_ROM_ID`).
          3. Download `sm64-symbian3` (`sm64.sisx`) and install. First run builds the toolchain (~2 h, cached).

          Local host step (Linux): `baserom.us.z64` in the repo root, then `python3 symbian/tools/prepare_symbian.py`
          (extracts assets, writes `symbian/app/gen/*.c` wrappers and `symbian/app/group/sm64.mmp`).

          ## Layout
          - `src/pc/symbian/` host interface, `gfx_symbian.c`, `audio_symbian.c`, `controller_symbian.c`, `pc_main_symbian.c`: C side of the port.
          - `symbian/app/` Avkon app: EGL (`sm64_gl.cpp`), frame loop + touch + menu (`sm64_view.cpp`), GL overlay (`sm64_overlay.cpp`), 44.1 kHz audio (`sm64_audio.cpp`).
          - `Makefile` `TARGET_SYMBIAN=1` is only used by the host pass (fake compiler, little-endian/32-bit asset generators).

          ## Controls
          Touch: floating stick (left), A/B bottom-right, C buttons, Z/L/R, START, MENU (top centre).
          Keys: arrows = stick, X/Space/Centre = A, C/Backspace = B, Z = Z, Enter = Start, Q/W = L/R, T/G/F/H = C-up/down/left/right, left soft key = menu.
          Menu: sound, pad, floating stick, mirror, opacity, size, frameskip, FPS, exit. Settings: `<drive>:\sm64\touch_settings.cfg`.

          ## Files
          `<drive>:\sm64\` holds `sm64.log` (+ `sm64_prev.log`), settings and the save file.

          ## Notes / limits
          - Not verified on hardware or in the SDK here: no ROM and no Symbian toolchain were available when this was written. Only the portable C was syntax-checked on a host. Expect to iterate from `sm64.log`.
          - If the app dies at start, rerun with `fpu = softvfp`.
          - ARM11 at ~680 MHz will not hold 30 fps everywhere; auto frameskip (menu) keeps logic speed. Turning sound off helps.
          - Config options of the PC menu that need SDL are unavailable.
          EOF_SM64
